<title>GEO Studio</title>
<meta name="description" content="GEO and AXO strategy studio: navigate the model, ask Claude, keep versioned assets per brand.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600&family=Space+Mono:wght@400;700&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Two brand systems, one component set. Both are dark-first by design,
   so the page commits to dark in every viewer theme and paints its own ground. */
:root {
  color-scheme: dark;
  --band-0:#5601a4; --band-1:#9410a2; --band-2:#c43e7f; --band-3:#e76e5b; --band-4:#fca338; --band-5:#f7e425;
  --bg:#000000; --surface:#0b0b0e; --surface-2:#131318; --surface-3:#1c1c22;
  --line:rgba(255,255,255,.10); --line-strong:rgba(255,255,255,.22);
  --text:#ffffff; --text-2:rgba(255,255,255,.86); --muted:rgba(255,255,255,.62); --faint:rgba(255,255,255,.42);
  --accent:var(--band-3); --accent-soft:color-mix(in oklab,var(--band-3) 16%,transparent); --on-accent:#0b0b0e;
  --highlight:var(--band-5); --positive:var(--band-5); --caution:var(--band-4); --critical:#ff6b57;
  --meter:var(--band-3);
  --gradient:linear-gradient(90deg,var(--band-0),var(--band-1) 20%,var(--band-2) 40%,var(--band-3) 60%,var(--band-4) 80%,var(--band-5));
  --gradient-text:linear-gradient(100deg,var(--band-2),var(--band-3),var(--band-4));
  --btn-primary:var(--accent);
  --rung-0:var(--band-0); --rung-1:var(--band-1); --rung-2:var(--band-2); --rung-3:var(--band-3); --rung-4:var(--band-4);
  --font-display:"Space Grotesk",system-ui,sans-serif; --font-body:"Hanken Grotesk",system-ui,sans-serif; --font-mono:"Space Mono",ui-monospace,monospace;
  --track:.2em; --radius:14px; --radius-sm:9px;
  --card-bg:var(--surface-2); --glow:none; --brand-name:"jean-paul · meridian";
}
:root[data-brand="om"] {
  --bg:#03040c; --surface:#0d0d1a; --surface-2:#11132a; --surface-3:#1a1a2e;
  --accent:#4f7ff2; --accent-soft:color-mix(in oklab,#4f7ff2 20%,transparent); --on-accent:#ffffff;
  --highlight:#00d1f9; --positive:#00f65b; --caution:#ff4e09; --critical:#f71735; --meter:#4f7ff2;
  --gradient:linear-gradient(123deg,#4f7ff2 0%,#b0228c 90%); --gradient-text:linear-gradient(123deg,#4f7ff2,#b0228c 90%);
  --btn-primary:linear-gradient(123deg,#4f7ff2 0%,#b0228c 90%);
  --rung-0:#2a3f8f; --rung-1:#4f7ff2; --rung-2:#7a52c0; --rung-3:#b0228c; --rung-4:#00d1f9;
  --font-display:"Instrument Sans",system-ui,sans-serif; --font-body:"Instrument Sans",system-ui,sans-serif; --font-mono:"Instrument Sans",system-ui,sans-serif;
  --track:.12em; --radius:18px; --radius-sm:11px;
  --card-bg:linear-gradient(160deg,rgba(79,127,242,.09),rgba(176,34,140,.05) 70%),#10122a;
  --glow:radial-gradient(70% 40% at 90% -5%,rgba(176,34,140,.35),transparent 70%),radial-gradient(60% 35% at 0% 0%,rgba(79,127,242,.30),transparent 70%);
  --brand-name:"omnicom media";
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);background-image:var(--glow);background-repeat:no-repeat;color:var(--text-2);font:400 15px/1.55 var(--font-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
*,*::before,*::after{box-sizing:border-box}
h1,h2,h3,h4{font-family:var(--font-display);color:var(--text);margin:0;line-height:1.15;letter-spacing:-.01em;text-wrap:balance;font-weight:600}
h1{font-size:clamp(1.7rem,6vw,2.4rem);letter-spacing:-.02em} h2{font-size:1.3rem} h3{font-size:1.05rem}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit}
.label{font:400 .68rem/1.3 var(--font-mono);text-transform:uppercase;letter-spacing:var(--track);color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.grad{background:var(--gradient-text);-webkit-background-clip:text;background-clip:text;color:transparent}
.muted{color:var(--muted)} .faint{color:var(--faint)}

/* shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in oklab,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .rule{height:3px;background:var(--gradient)}
.top-in{display:flex;align-items:center;gap:12px;padding:10px 16px;max-width:880px;margin:0 auto}
.logo{display:flex;align-items:center;gap:8px;min-width:0;color:var(--text);font:600 1.05rem var(--font-display);white-space:nowrap}
.logo i{width:10px;height:10px;border-radius:50%;background:var(--gradient)}
.logo small{font:400 .6rem var(--font-mono);letter-spacing:var(--track);text-transform:uppercase;color:var(--faint)}
.logo small::before{content:var(--brand-name)}
.spacer{flex:1}
.toggle{display:inline-flex;border:1px solid var(--line-strong);border-radius:999px;padding:2px;background:var(--surface)}
.toggle button{border:0;background:transparent;color:var(--muted);font:700 .7rem var(--font-mono);letter-spacing:.08em;padding:5px 11px;border-radius:999px;cursor:pointer}
.toggle button[aria-pressed="true"]{background:var(--gradient);color:#fff}
main{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:18px 110px;display:flex;flex-direction:column;gap:18px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in oklab,var(--surface) 94%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs-in{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:520px;margin:0 auto}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:transparent;color:var(--muted);padding:6px 4px;border-radius:12px;cursor:pointer;font-size:.74rem;font-weight:600}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--text);background:var(--surface-3)}
.tab[aria-current="page"] svg{color:var(--accent)}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-strong);background:transparent;color:var(--text);font-weight:600;font-size:.9rem;padding:9px 15px;border-radius:999px;cursor:pointer;white-space:nowrap;text-decoration:none;min-height:40px}
.btn.primary{background:var(--btn-primary);border-color:transparent;color:var(--on-accent)}
.btn.small{padding:5px 11px;font-size:.8rem;min-height:32px}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn.danger{border-color:var(--critical);color:var(--critical)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.toggle button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:6px}
input[type=text],input[type=url],input[type=search],select,textarea{width:100%;background:var(--surface);color:var(--text);border:1px solid var(--line-strong);border-radius:var(--radius-sm);padding:11px 12px;font:400 16px var(--font-body)}
textarea{resize:vertical;min-height:110px;line-height:1.5}
textarea.code{font:400 14px/1.5 ui-monospace,"Space Mono",monospace;min-height:280px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}

/* surfaces */
.card{background:var(--card-bg);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:10px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line-strong);border-radius:999px;padding:2px 9px;font:400 .66rem var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap;background:transparent;cursor:default}
button.chip{cursor:pointer;font-size:.7rem;padding:5px 11px}
.chip.on,.chip.accent{border-color:var(--accent);color:var(--accent)}
.chip.new{border-color:var(--highlight);color:var(--highlight)}
.chip.high{border-color:var(--positive);color:var(--positive)} .chip.medium{border-color:var(--caution);color:var(--caution)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.scroll-x{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.scroll-x::-webkit-scrollbar{display:none}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%;color:inherit}
.item:last-child{border-bottom:0}
.item .t{color:var(--text);font-weight:600}
.item .s{color:var(--faint);font-size:.8rem}
.item .go{margin-left:auto;color:var(--faint)}
.empty{border:1px dashed var(--line-strong);border-radius:var(--radius);padding:22px;text-align:center;color:var(--muted);font-size:.92rem}
.notice{border:1px solid var(--caution);color:var(--text-2);border-radius:var(--radius-sm);padding:10px 12px;font-size:.88rem}
.err{border:1px solid var(--critical);color:var(--text-2);border-radius:var(--radius-sm);padding:10px 12px;font-size:.88rem}
.back{align-self:flex-start}

/* hero + ladder */
.hero{display:flex;flex-direction:column;gap:10px;padding-top:6px}
.hero p{font-size:1rem;max-width:58ch}
.ladder{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.rung{position:relative;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 9px 11px;overflow:hidden;min-width:0}
.rung::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--c)}
.rung b{display:block;font:700 .7rem var(--font-mono);color:var(--muted)}
.rung span{display:block;color:var(--text);font:600 .9rem var(--font-display);margin-top:2px}
@media (max-width:520px){.ladder{grid-template-columns:repeat(5,minmax(0,1fr))}.rung{padding:9px 6px}.rung span{font-size:.78rem}}
.proj{display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer;color:inherit;font:inherit}
.proj .score{font:600 1.8rem/1 var(--font-display);color:var(--text)}
.ex{color:var(--highlight)}

/* ARI meters */
.meter{display:grid;grid-template-columns:1fr 40px;gap:4px 10px;align-items:center;padding:6px 0}
.meter .n{color:var(--text-2);font-size:.9rem}
.meter .n small{color:var(--faint);font-size:.74rem;margin-left:4px}
.meter .v{text-align:right;color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}
.meter input{grid-column:1/-1;width:100%;accent-color:var(--meter)}
.big{font:600 3rem/1 var(--font-display);color:var(--text);font-variant-numeric:tabular-nums}
.bands{display:grid;grid-template-columns:40fr 20fr 20fr 21fr;gap:2px}
.bands div{height:6px;border-radius:3px;background:var(--surface-3)}
.bands div.on{background:var(--meter)}

/* knowledge */
.k-card .id{font:700 .74rem var(--font-mono);color:var(--accent)}
.k-card p{font-size:.9rem}
.k-card .meta{font-size:.84rem;color:var(--muted)} .k-card .meta b{color:var(--text-2);font-weight:600}
.k-card ul{margin:0;padding-left:18px;font-size:.86rem} .k-card li{margin-bottom:4px}
details summary{cursor:pointer;color:var(--muted);font-size:.84rem}

/* chat */
.thread{display:flex;flex-direction:column;gap:14px}
.q{align-self:flex-end;max-width:88%;background:var(--surface-3);color:var(--text);padding:10px 13px;border-radius:14px 14px 4px 14px;white-space:pre-wrap;font-size:.94rem}
.a{display:flex;flex-direction:column;gap:8px}
.thinking{color:var(--muted);font-size:.86rem;display:flex;gap:8px;align-items:center}
.thinking::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite alternate}
@keyframes pulse{from{opacity:.3}to{opacity:1}}
.save{display:flex;flex-wrap:wrap;gap:8px;padding-top:10px;border-top:1px dashed var(--line)}
.save input{flex:1;min-width:150px;padding:8px 10px;font-size:15px}
.composer{position:sticky;bottom:calc(74px + env(safe-area-inset-bottom,0px));background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius);padding:10px;display:flex;flex-direction:column;gap:8px;z-index:5}
.composer textarea{min-height:64px;border:0;background:transparent;padding:4px}
.suggest{display:flex;flex-direction:column;gap:6px}
.suggest button{text-align:left;justify-content:flex-start;white-space:normal;border-radius:var(--radius-sm)}

/* prose */
.prose{color:var(--text-2);font-size:.95rem;overflow-wrap:anywhere}
.prose h1{font-size:1.5rem;margin:.8em 0 .4em} .prose h2{font-size:1.2rem;margin:1.2em 0 .4em} .prose h3{font-size:1.02rem;margin:1em 0 .3em}
.prose p{margin:0 0 .8em} .prose ul,.prose ol{padding-left:1.2em;margin:0 0 .8em} .prose li{margin-bottom:.3em}
.prose strong{color:var(--text)}
.prose table{border-collapse:collapse;font-size:.84rem;display:block;overflow-x:auto;margin:0 0 1em;max-width:100%}
.prose th{text-align:left;color:var(--muted);border-bottom:1px solid var(--line-strong);padding:6px 8px;white-space:nowrap}
.prose td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top;min-width:110px}
.prose code{font-size:.85em;background:var(--surface-3);padding:.1em .3em;border-radius:4px}
.prose pre{background:var(--surface);border:1px solid var(--line);padding:10px;border-radius:8px;overflow-x:auto}
.prose blockquote{margin:0 0 .8em;padding:.2em .9em;border-left:3px solid var(--accent);color:var(--muted)}
.versions{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
@media (max-width:440px){.logo small{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  <div class="rule"></div>
  <div class="top-in">
    <div class="logo"><i></i>GEO Studio <small></small></div>

      <button type="button" id="brand-jp" data-brand="jp" aria-pressed="true">JP</button>

<script>
"use strict";
const KB = {"meta":{"name":"GEO / AXO Knowledge Model","version":"2.0.0","as_of":"2026-09-26","summary":"Canonical model for generative engine optimisation (GEO) and agentic experience optimisation (AXO). Extends the Local Discovery OS (W1-W14) with brand-level agentic workstreams (W15-W20), a fourth Mandate layer, the Delegation Ladder, Agent Readiness Index v2, a surface and protocol register, predictions to end-2027 and a ranked action set. Read by the geo-axo-strategist skill and by GEO Studio."},"layers":[{"id":"entity","name":"Entity layer","question":"Who is this brand, unambiguously?","optimised_for":"Machine resolution: one canonical, verifiable identity, product and offer graph","failure":"Entity ambiguity: the agent cannot tell which product, seller or claim is real"},{"id":"surface","name":"Surface layer","question":"Where is the brand rendered, and how fresh and corroborated is it?","optimised_for":"Coverage, freshness and third-party evidence on every surface an engine reads","failure":"Invisible or uncorroborated on the surface the buyer's agent actually read"},{"id":"protocol","name":"Protocol layer","question":"Can a non-human buyer complete the job?","optimised_for":"Feeds, checkout protocols, agent identity acceptance, callable endpoints","failure":"Recommended but not transactable: the agent routes to whoever can be bought"},{"id":"mandate","name":"Mandate layer","question":"Does the brand stay chosen once a person delegates the decision?","optimised_for":"Being the stored default in agent memory, standing orders, subscriptions and account links","failure":"Won once, then silently swapped out when the agent re-optimises on price or availability","new_in":"2.0"}],"arenas":[{"id":"eligibility","name":"Eligibility","question":"May the brand be considered at all?"},{"id":"justification","name":"Justification","question":"Why this one over the near-identical alternative?"},{"id":"defaults","name":"Defaults","question":"What is returned or bought when the person states no preference?"}],"delegation_ladder":[{"rung":"D0","name":"Ask","description":"Person asks an engine; engine answers with a summary.","what_wins":"Being retrievable and cited (classic GEO).","example":"AI Overviews, Perplexity, ChatGPT search"},{"rung":"D1","name":"Advise","description":"Engine returns a shortlist of 1-3 options with reasons.","what_wins":"Shortlist inclusion and a clear justification the model can repeat.","example":"ChatGPT shopping answers, Alexa for Shopping comparisons"},{"rung":"D2","name":"Arrange","description":"Agent prepares the cart, form or booking; the person confirms.","what_wins":"Machine-legible offer, price and availability; low-friction handoff.","example":"ChatGPT hand-off to merchant checkout, Google AI Mode hotel booking"},{"rung":"D3","name":"Act","description":"Agent completes the transaction inside a mandate the person granted.","what_wins":"Protocol support (UCP/ACP/AP2), agent identity acceptance, reliability record.","example":"Meta Muse purchases via Link by Stripe, Alexa Buy for Me, Gemini checkout"},{"rung":"D4","name":"Autopilot","description":"Standing mandate: the agent re-buys, renews or switches without asking.","what_wins":"Being the stored default; switching costs; service record the agent audits.","example":"Alexa auto-buy at target price and Scheduled Actions, B2B replenishment agents"}],"workstreams":[{"id":"W1","layer":"entity","arena":"eligibility","name":"Entity resolution and consistency","summary":"One canonical identity across every surface; variance register; duplicate hunt; credential verification.","source":"LDOS"},{"id":"W2","layer":"entity","arena":"eligibility","name":"Category architecture","summary":"Platform categories as hard filters; map to schema.org types and canonical service taxonomy.","source":"LDOS"},{"id":"W3","layer":"entity","arena":"eligibility","name":"Attribute and filter coverage","summary":"Filter attributes gate inclusion; trust attributes change choice. Mirror every true attribute into structured data.","source":"LDOS"},{"id":"W4","layer":"entity","arena":"eligibility","name":"Service catalogue and coverage geometry","summary":"Full, true service and coverage set, evidenced, machine-readable.","source":"LDOS"},{"id":"W5","layer":"surface","arena":"justification","name":"Review corpus and velocity","summary":"Review text is the richest third-party evidence a model summarises. Track service and area coverage in review language.","source":"LDOS"},{"id":"W6","layer":"surface","arena":"justification","name":"Review response system","summary":"Responses as corroborated, evidence-adding owned text. Human approves every response.","source":"LDOS"},{"id":"W7","layer":"surface","arena":"justification","name":"Freshness: posts and photos","summary":"Real, captioned, area-specific imagery becomes a multimodal retrieval asset.","source":"LDOS"},{"id":"W8","layer":"surface","arena":"justification","name":"Profile narrative","summary":"Answer-shaped descriptions that resolve an intent cleanly.","source":"LDOS"},{"id":"W9","layer":"surface","arena":"defaults","name":"Query and keyword gap","summary":"Discount opportunity by AI-answer incidence; track ai_answer_incidence as a time series.","source":"LDOS"},{"id":"W10","layer":"surface","arena":"defaults","name":"Owned-page performance","summary":"Branded vs discovery split; recovery set; CTR shifts that reflect SERP shape, not page quality.","source":"LDOS"},{"id":"W11","layer":"surface","arena":"defaults","name":"Page architecture","summary":"Build only where evidence exists; answer paragraph, coverage, price basis, availability on every page.","source":"LDOS"},{"id":"W12","layer":"protocol","arena":"eligibility","name":"Structured data and entity graph","summary":"Schema completeness and validity, sameAs identity graph, credential and coverage markup, answer-shaped blocks.","source":"LDOS"},{"id":"W13","layer":"protocol","arena":"defaults","name":"Machine-readable feeds and endpoints","summary":"Access policy, service/price/availability feeds, booking callability, llms.txt as cheap optionality, agent journey test.","source":"LDOS"},{"id":"W14","layer":"protocol","arena":"justification","name":"Answer-engine probing and citation share","summary":"Fixed probe set, repeated runs, share of answer, third-party grounding share, factual error remediation loop.","source":"LDOS"},{"id":"W15","layer":"protocol","arena":"eligibility","name":"Agent access and identity","new_in":"2.0","summary":"Decide, per agent class, what may read and act on your properties, and make sure verified buying agents are recognised rather than blocked.","tasks":["T15.1 Inventory CDN, WAF and bot-management defaults per domain. Cloudflare blocks Agent and Training crawlers by default on ad-displaying pages of new domains from 15 Sep 2026; check every new microsite and market domain.","T15.2 Classify traffic: training crawler, retrieval crawler, user-invoked browsing agent (Muse Secure VM, ChatGPT agent, Gemini), payment-network-verified agent.","T15.3 Accept verified agent identity: Visa Trusted Agent Protocol, Mastercard Agent Pay agentic tokens, signed-request schemes such as Web Bot Auth. Work with PSP and fraud team so verified agents are not challenged by CAPTCHA.","T15.4 Write the access decision down (allow retrieval and verified agents, decide training deliberately) and publish a plain agent policy page.","T15.5 Segment agent traffic in analytics and log agent sessions separately from bots and humans."],"metrics":["protocol.access.verified_agent_pass_rate","protocol.access.retriever_allowed","protocol.access.agent_session_share"],"automation":"Audit: automate weekly. Policy: retain."},{"id":"W16","layer":"protocol","arena":"defaults","name":"Agentic commerce rails","new_in":"2.0","summary":"Make the catalogue and checkout callable by the main agent commerce protocols without replatforming.","tasks":["T16.1 One canonical product/offer feed (GTIN, variant, price, stock, shipping, returns, policy) syndicated to Google Merchant Center (UCP), ChatGPT feeds, Meta catalogue and retailer feeds.","T16.2 Protocol coverage matrix: UCP (discovery, cart, checkout, post-purchase), ACP (payment inside AI surface), AP2 (mandate proof), MCP (tools). Target at least two by mid-2027.","T16.3 Switch on the rails your PSP or platform already offers: Shopify agentic storefronts and Shop Pay, Stripe Agentic Commerce Suite and Link, PayPal, commercetools AgenticLift.","T16.4 Agent journey test per surface: resolve product, compare, confirm price and stock, add to cart, pay, receive order confirmation. Record the depth reached.","T16.5 Post-purchase legibility: machine-readable order confirmations, returns and tracking, because agents with inbox access read them."],"metrics":["protocol.feed.attribute_completeness","protocol.feed.freshness_hours","protocol.commerce.protocols_supported","protocol.journey.completion_depth"],"automation":"Feed QA: automate daily. Journey tests: assist, monthly per surface."},{"id":"W17","layer":"surface","arena":"eligibility","name":"Agent surface coverage","new_in":"2.0","summary":"Track each consumer and B2B agent as a distinct surface with its own reach, rules and walls.","tasks":["T17.1 Maintain a surface register: Meta Muse, ChatGPT, Gemini and AI Mode, Siri AI, Alexa for Shopping, Microsoft Copilot, Perplexity, plus B2B agents (Agentforce, Copilot Studio, procurement suites).","T17.2 For each surface record: how it discovers (open web, index, catalogue, connectors), how it transacts, which walls apply (for example Amazon blocking Muse purchases), and which paid units exist.","T17.3 Build connectors where the surface has a program: Muse connector program, Siri App Intents (now the mandatory Siri integration path), Alexa skills and Buy for Me eligibility, ChatGPT apps.","T17.4 Run the W14 probe set per surface; report share of answer and shortlist rate per surface, never pooled."],"metrics":["geo.share_of_answer.by_surface","geo.shortlist_rate.by_surface","protocol.surface.connector_coverage"],"automation":"Probing: automate weekly. Connector builds: retain."},{"id":"W18","layer":"protocol","arena":"justification","name":"Brand agent and conversational endpoints","new_in":"2.0","summary":"Give buying agents something authoritative to talk to: the brand's own agent, MCP server or NLWeb endpoint.","tasks":["T18.1 Decide the brand-agent scope: product Q&A, fit and compatibility, stock and price, returns, service booking. Ground it only in the canonical record.","T18.2 Expose it where agents look: an MCP server or documented API, NLWeb on content-heavy sites, WhatsApp business AI, ChatGPT Sponsored Agents (from Sep 2026).","T18.3 Agent-to-agent readiness: answer in structured form, state policy limits, never invent discounts. Log every agent conversation for QA.","T18.4 Test with hostile prompts: price haggling, competitor comparison, policy edge cases."],"metrics":["protocol.brand_agent.answer_accuracy","protocol.brand_agent.agent_sessions","protocol.brand_agent.escalation_rate"],"automation":"QA sampling: assist. Scope and policy: retain."},{"id":"W19","layer":"mandate","arena":"defaults","name":"Mandate and memory equity","new_in":"2.0","summary":"Win the moment a person delegates, then keep the slot. Personal agents with memory (Muse, Siri personal context, Alexa) store preferences and re-evaluate them.","tasks":["T19.1 Map the mandate moments in the category: first purchase via agent, subscription, replenishment, renewal, target-price auto-buy.","T19.2 Offer structured standing options: subscribe-and-save, price guarantees, loyalty linked to the agent account, easy reorder identifiers.","T19.3 Make the service record auditable: delivery reliability, returns speed and stock accuracy are what an agent checks before it re-buys.","T19.4 Watch for switch events: lost subscriptions, reorders routed to substitutes. Treat each as a defaults defect."],"metrics":["mandate.retention.agent_reorder_rate","mandate.default.standing_orders","mandate.switch.loss_rate"],"automation":"Monitoring: automate. Offer design: retain."},{"id":"W20","layer":"entity","arena":"justification","name":"B2B buying-agent readiness","new_in":"2.0","summary":"B2B buyers use agents for research, shortlisting and increasingly negotiation. Make your evidence the easiest to verify.","tasks":["T20.1 Publish machine-readable spec sheets, pricing or pricing logic, SLAs, integrations and compliance (trust centre with SOC 2, ISO, DPA) at stable URLs.","T20.2 Build an RFP answer corpus: the 200 questions buyers' agents ask, answered once, versioned and citable.","T20.3 Corroborate on the sources agents weight: analyst notes, peer review sites, marketplaces, partner directories.","T20.4 Expose quote, trial and availability through an API or MCP server so procurement agents can transact.","T20.5 Probe as a buyer's agent: 'shortlist three vendors for X with SOC 2 and EU hosting under budget Y'."],"metrics":["b2b.shortlist_rate","b2b.evidence.machine_readable_ratio","b2b.agent_rfp_coverage"],"automation":"Corpus drafting: assist. Commercial terms: retain."}],"ari":{"name":"Agent Readiness Index v2","scale":"0-100","note":"v1 had five components. v2 splits access from feeds, adds Mandate equity and rebalances. Report with components, never the single number alone.","components":[{"id":"entity","name":"Entity resolvability","weight":20,"measures":"Identity consistency, sameAs graph, GTIN and product identity, credential verifiability"},{"id":"claims","name":"Claim legibility","weight":15,"measures":"Schema coverage and validity, answer-shaped passages, explicit price, policy and spec"},{"id":"corroboration","name":"Third-party corroboration","weight":20,"measures":"Review depth and freshness, earned editorial and list presence, independent citations"},{"id":"access","name":"Access and identity","weight":10,"measures":"Retriever and verified-agent access, agent traffic segmentation, policy published"},{"id":"feeds","name":"Feeds and protocols","weight":15,"measures":"Feed completeness and freshness, protocols supported, brand agent or MCP endpoint"},{"id":"transact","name":"Transactability","weight":10,"measures":"Agent journey completion depth per surface, checkout success, latency"},{"id":"mandate","name":"Mandate equity","weight":10,"measures":"Standing-order options, agent reorder rate, service reliability record"}],"bands":[{"min":0,"max":39,"label":"Invisible to agents"},{"min":40,"max":59,"label":"Retrievable, not choosable"},{"min":60,"max":79,"label":"Choosable, partly transactable"},{"min":80,"max":100,"label":"Agent-native"}]},"surfaces":[{"id":"muse","name":"Meta Muse","owner":"Meta","segment":"consumer","launched":"2026-09-08","how_it_works":"Personal agent powered by Muse Spark. Runs in Muse Secure VM with its own browser, reads the open web, learns from conversations. Connects to Gmail, Spotify, Ticketmaster, Shopify, OpenTable. Pays via Link by Stripe.","commerce":"Partners: Stripe, Shopify, Best Buy, Gap, Sephora, Walmart, Wayfair; Expedia and Instacart to follow; PayPal opening its merchant network. Amazon blocks Muse purchases.","reach":"US on iOS, Android, web and WhatsApp. Free, $20 and $100 tiers. Glasses, avatars and a keychain device announced at Connect (23 Sep 2026).","paid":"No ads announced. Watch for sponsored recommendations and Advantage+ extensions.","brand_levers":"Structured product data and open-web evidence (thin data gives Muse nothing to compare). Shopify or Stripe rails. Connector program (1,500+ applications in week one). WhatsApp business AI."},{"id":"chatgpt","name":"ChatGPT (search, shopping, agent)","owner":"OpenAI","segment":"consumer+b2b","how_it_works":"Answers and shopping results from its index and merchant feeds; agent mode browses and acts.","commerce":"ACP with Stripe. Instant Checkout scaled back on 4 Mar 2026; purchases now hand off to the merchant's own checkout.","reach":"Global.","paid":"Feeds in Ads Manager (2 Jun 2026; up to 1M SKUs). Sponsored Agents, AI ad builder, HubSpot and Shopify integrations (16 Sep 2026).","brand_levers":"Google-Shopping-format feed reused; sponsored agent as brand endpoint; earned citations."},{"id":"google","name":"Google AI Mode and Gemini","owner":"Google","segment":"consumer","how_it_works":"AI Overviews and AI Mode answers; Gemini app agent; Business Agent in Search.","commerce":"Universal Commerce Protocol (UCP) from Jan 2026, co-developed with Shopify, Etsy, Wayfair and Target; checkout in AI Mode and Gemini; AP2 for mandates. Agentic hotel booking in AI Mode from 27 Aug 2026 (US, English).","reach":"Global search scale.","paid":"Ads in AI Overviews and AI Mode.","brand_levers":"Merchant Center feed quality, UCP enablement, Business Profile, structured data."},{"id":"siri","name":"Siri AI","owner":"Apple (Gemini-based models)","segment":"consumer","launched":"2026-09","how_it_works":"System-wide agent with on-screen awareness and personal context (Messages, Mail, Photos, Calendar, Files, Reminders); chains tasks across apps. On-device plus Private Cloud Compute.","commerce":"Acts through apps. App Intents is now the mandatory integration path; SiriKit is being deprecated.","reach":"Shipped with iPhone 18 (Sep 2026).","paid":"None.","brand_levers":"App Intents coverage in the brand app; machine-readable receipts and confirmations in Mail, which personal context reads."},{"id":"alexa","name":"Alexa for Shopping (was Rufus)","owner":"Amazon","segment":"consumer","launched":"2026-05-13","how_it_works":"Shopping agent across the Amazon app, amazon.com and Echo Show.","commerce":"Buy for Me can buy from other retailers; auto-buy at target price; Scheduled Actions for recurring purchases. Amazon blocks third-party agents such as Muse.","reach":"All US customers.","paid":"Sponsored placements inside shopping answers.","brand_levers":"Listing content written to answer questions, reviews and Q&A, off-Amazon site legibility for Buy for Me."},{"id":"copilot","name":"Microsoft Copilot and Copilot Studio","owner":"Microsoft","segment":"b2b+consumer","how_it_works":"Consumer Copilot shopping; enterprise agents built in Copilot Studio (160,000 organisations, 400,000+ agents in the first 90 days).","commerce":"Merchant programs; MCP connectors.","reach":"Enterprise.","paid":"Ads in Copilot.","brand_levers":"MCP servers, Bing index, NLWeb on content sites."},{"id":"agentforce","name":"Salesforce Agentforce and B2B buying agents","owner":"Salesforce and others","segment":"b2b","how_it_works":"Seller and buyer agents inside CRM and procurement. IDC (Aug 2026): 8 in 10 B2B tech buyers use AI agents in purchasing.","commerce":"Procurement suites, marketplaces, MCP servers (Outreach and Salesloft shipped MCP in spring 2026).","reach":"Enterprise.","paid":"Marketplace listings.","brand_levers":"Machine-readable spec, pricing and trust documents; RFP corpus; quote API."},{"id":"perplexity","name":"Perplexity","owner":"Perplexity","segment":"consumer","how_it_works":"Answer engine with shopping and agentic browser.","commerce":"Merchant program, PayPal checkout.","reach":"Global.","paid":"Sponsored follow-ups.","brand_levers":"Citable sources, product feeds."}],"protocols":[{"id":"ucp","name":"Universal Commerce Protocol (UCP)","owner":"Google plus partners","layer":"What to sell, cart, checkout, orders, post-purchase","status":"Public since Jan 2026","action":"Enable through Merchant Center or your commerce platform."},{"id":"acp","name":"Agentic Commerce Protocol (ACP)","owner":"OpenAI and Stripe","layer":"Payment execution inside an AI surface","status":"Live; Instant Checkout scaled back Mar 2026","action":"Enable via Stripe or Shopify if you run on them."},{"id":"ap2","name":"Agent Payments Protocol (AP2)","owner":"Google plus 60+ partners","layer":"Proof a person authorised the agent (mandates)","status":"Announced Sep 2025","action":"Ask your PSP for its AP2 support roadmap."},{"id":"tap","name":"Visa Trusted Agent Protocol and Intelligent Commerce","owner":"Visa","layer":"Agent identity and tokenised credentials","status":"Live","action":"Recognise trusted agents at the edge; do not CAPTCHA them."},{"id":"agentpay","name":"Mastercard Agent Pay","owner":"Mastercard","layer":"Agentic tokens binding cardholder, agent and mandate scope","status":"Live","action":"Confirm acquirer support."},{"id":"mcp","name":"Model Context Protocol (MCP)","owner":"Open standard","layer":"Tools and data for agents","status":"Widely adopted","action":"Expose catalogue, stock, quote and policy as MCP tools."},{"id":"a2a","name":"Agent2Agent (A2A)","owner":"Open standard","layer":"Agent-to-agent messaging","status":"Emerging","action":"Track; relevant once brand agents negotiate."},{"id":"appintents","name":"Apple App Intents","owner":"Apple","layer":"How Siri acts inside apps","status":"Mandatory path for Siri from iOS 27","action":"Cover every high-value action in the brand app."},{"id":"nlweb","name":"NLWeb","owner":"Microsoft (open source)","layer":"Natural-language query endpoint for a site","status":"Early adoption; one-click on Cloudflare","action":"Low-cost pilot for content-rich sites."},{"id":"llmstxt","name":"llms.txt","owner":"Community convention","layer":"Plain-language site summary for models","status":"About 1 in 10 sites; no major engine committed","action":"Cheap optionality only; never sell it as a ranking lever."}],"concepts":[{"id":"c1","name":"From ranking to recommendation-set inclusion","idea":"The unit of competition is no longer a position on a page but membership of the 1-3 options an agent will consider. Parity makes you eligible; only asymmetric evidence gets you chosen."},{"id":"c2","name":"Machine availability","idea":"The agentic analogue of mental availability. Brands are chosen by agents when they are easy to resolve, easy to verify and easy to transact. Distinctive assets need machine-legible twins: consistent names, identifiers, claims with evidence and packaging a camera can recognise."},{"id":"c3","name":"The Delegation Ladder","idea":"Ask, Advise, Arrange, Act, Autopilot. Each rung changes what wins. Most brands optimise D0-D1; 2027 value moves to D3-D4, where reliability and mandates matter more than persuasion."},{"id":"c4","name":"The Mandate layer","idea":"Once a person says 'just keep me stocked' or 'always book the usual', the default sits in agent memory and is re-audited on service data. Winning the first delegation is the new first-purchase moment."},{"id":"c5","name":"Two-stack reality","idea":"Walled gardens (Amazon blocking Muse) and open-web agents (Muse, ChatGPT, Gemini) need different stacks: retail-media and listing optimisation inside walls, protocol and evidence work outside."},{"id":"c6","name":"Paid AXO","idea":"Ads are moving inside agents: ChatGPT feed ads and Sponsored Agents, Google ads in AI Mode, Amazon sponsored answers. Expect Meta to monetise Muse. Paid placement will buy consideration, not the final choice. Evidence still decides."},{"id":"c7","name":"Evidence economy","idea":"Engines weight third-party corroboration and recency. Third-party grounding share beats owned-only citation. Listicles are the most-cited format (~21%), so expect engines to discount pay-to-play lists."},{"id":"c8","name":"Agent identity is the new robots.txt","idea":"The question moves from 'which crawlers do I allow' to 'which verified agents acting for which people may transact'. Default bot blocking can make a brand invisible by accident."},{"id":"c9","name":"The inbox as evidence","idea":"Personal agents read email (Muse via Gmail, Siri via Mail). Order confirmations, receipts and service messages become machine-read evidence of reliability. Make them structured and accurate."},{"id":"c10","name":"Brand agents meet buyer agents","idea":"The website becomes one interface among several. A grounded brand agent or MCP endpoint answers buying agents with authority. Agent-to-agent negotiation starts in travel, insurance and B2B."}],"predictions":[{"id":"P1","horizon":"H1 2027","confidence":"high","statement":"Meta introduces paid units inside Muse (sponsored recommendations or sponsored connectors), sold through Advantage+.","signals":"Muse ad tests; Advantage+ catalogue settings mentioning Muse; Digiday and Meta earnings commentary.","implication":"Meta catalogue quality and creative-to-data alignment become Muse eligibility inputs."},{"id":"P2","horizon":"2027","confidence":"high","statement":"Every top-4 consumer assistant (ChatGPT, Gemini, Muse, Alexa) supports agent checkout or hand-off for mainstream retail, and at least two protocol bridges (UCP to ACP) ship through major PSPs.","signals":"PSP release notes (Stripe, Adyen, PayPal, Shopify).","implication":"Brands that support at least two rails through their PSP gain distribution at almost no marginal cost."},{"id":"P3","horizon":"2027","confidence":"high","statement":"Walled gardens harden. Amazon keeps blocking third-party agents and sells agent-era retail media; other large retailers follow with 'agent tolls'.","signals":"robots and ToS changes; retailer agent APIs with fees.","implication":"Plan two stacks and a budget line for in-wall agent placements."},{"id":"P4","horizon":"H2 2027","confidence":"medium","statement":"Verified agent identity becomes a default CDN and PSP setting; unverified automated checkout is challenged or blocked by default.","signals":"Cloudflare and Akamai product launches; card network mandates.","implication":"Misconfigured bot rules become the most common cause of agentic invisibility."},{"id":"P5","horizon":"2027","confidence":"medium","statement":"Standing mandates (auto-replenish, target-price buy, renewals) reach mainstream use in grocery, household, pet and consumables.","signals":"Alexa Scheduled Actions usage; Muse Instacart launch.","implication":"FMCG share shifts from shelf moments to mandate moments; pack-size and subscription architecture become media decisions."},{"id":"P6","horizon":"2027","confidence":"high","statement":"B2B first-round shortlisting is done by agents for most software and services purchases; vendors without machine-readable pricing and trust documents are systematically under-shortlisted.","signals":"IDC and Gartner buyer studies; procurement suite agent launches.","implication":"Trust centre, pricing logic and RFP corpus are growth assets."},{"id":"P7","horizon":"2027","confidence":"medium","statement":"Share of answer and share of shortlist become standard KPIs in brand trackers and are tested as variables in MMM.","signals":"Tracker vendors adding AI modules; only 16% of brands track AI performance systematically in 2026.","implication":"Brands with a 2026 probe baseline own the only credible time series."},{"id":"P8","horizon":"2027","confidence":"medium","statement":"Brand agents become a standard ad destination (Sponsored Agents, WhatsApp click-to-agent), overtaking landing pages for considered purchases in some categories.","signals":"OpenAI Sponsored Agents adoption; Meta click-to-WhatsApp AI agents.","implication":"The brand agent needs the same governance as the website and call centre."},{"id":"P9","horizon":"2027","confidence":"medium","statement":"Regulators act on agent steering: disclosure rules for sponsored agent recommendations and liability for agent purchase errors (EU consumer law and AI Act transparency; FTC).","signals":"EU Digital Fairness Act drafts; FTC guidance.","implication":"Clean, disclosed paid AXO and accurate structured claims become a compliance matter."},{"id":"P10","horizon":"2027","confidence":"medium","statement":"Ambient, camera-first agents (Muse glasses, Siri camera mode) make physical recognition a discovery path: pack, shelf and out-of-home assets are read by machines.","signals":"Glasses sales; visual search share.","implication":"Distinctive assets need to be recognisable to models, not only to people."},{"id":"P11","horizon":"2027","confidence":"high","statement":"Many brand-side agent projects fail (Gartner expects 40%+ of agentic projects cancelled by end-2027). Winners invest in data foundations first.","signals":"Project write-downs; vendor consolidation.","implication":"Sequence: entity and feeds before bespoke agents."},{"id":"P12","horizon":"2027","confidence":"low","statement":"Engines start discounting pay-to-play listicles and weight verified purchase reviews and first-party service data more heavily.","signals":"Citation mix shifts in probe data.","implication":"Durable GEO is built on verified evidence, not placement volume."}],"actions":[{"id":"A1","priority":1,"horizon":"Now (Q4 2026)","effort":"L","name":"Run the agent access audit","why_2027":"One misconfigured bot rule can cancel every other investment. The Cloudflare default change (15 Sep 2026) makes this urgent for new domains.","workstreams":["W13","W15"],"owner":"Web platform and security","kpi":"protocol.access.verified_agent_pass_rate"},{"id":"A2","priority":2,"horizon":"Now (Q4 2026)","effort":"M","name":"Fix the canonical product and offer feed","why_2027":"Only about 1 in 5 merchants has machine-readable catalogues. The same feed powers Google UCP, ChatGPT feed ads and Meta catalogue, so one fix pays three times.","workstreams":["W16","W12"],"owner":"Ecommerce","kpi":"protocol.feed.attribute_completeness"},{"id":"A3","priority":3,"horizon":"Now (Q4 2026)","effort":"M","name":"Start the probe baseline across agent surfaces","why_2027":"Nobody can buy a historical time series. A 2026 baseline makes 2027 movement provable and fundable.","workstreams":["W14","W17"],"owner":"Search and insight","kpi":"geo.share_of_answer.by_surface"},{"id":"A4","priority":4,"horizon":"Q1 2027","effort":"M","name":"Switch on agent checkout through your PSP or platform","why_2027":"Rails exist now (Shopify, Stripe, PayPal, commercetools). Early merchants accumulate the reliability record agents audit.","workstreams":["W16"],"owner":"Ecommerce and payments","kpi":"protocol.journey.completion_depth"},{"id":"A5","priority":5,"horizon":"Q1 2027","effort":"M","name":"Build a third-party corroboration program","why_2027":"Engines favour earned, recent, independent evidence. It compounds and competitors cannot copy it quickly.","workstreams":["W5","W14"],"owner":"PR, CX and social","kpi":"geo.third_party_grounding_share"},{"id":"A6","priority":6,"horizon":"Q1 2027","effort":"L","name":"Create machine-legible distinctive assets","why_2027":"Consistent names, GTINs, claims with evidence and recognisable packs raise resolvability for text and camera agents.","workstreams":["W1","W12"],"owner":"Brand and product data","kpi":"entity.consistency.nap_variance"},{"id":"A7","priority":7,"horizon":"H1 2027","effort":"H","name":"Launch a grounded brand agent or MCP endpoint","why_2027":"Buying agents need an authoritative counterpart. Sponsored Agents and WhatsApp AI make it a paid destination as well.","workstreams":["W18"],"owner":"Digital product and CX","kpi":"protocol.brand_agent.answer_accuracy"},{"id":"A8","priority":8,"horizon":"H1 2027","effort":"M","name":"Design for mandate moments","why_2027":"Standing orders lock in share. Subscription, reorder and price-guarantee options structured for agents capture defaults before competitors do.","workstreams":["W19"],"owner":"CRM and ecommerce","kpi":"mandate.retention.agent_reorder_rate"},{"id":"A9","priority":9,"horizon":"H1 2027","effort":"M","name":"Publish the B2B evidence pack","why_2027":"Agent shortlists favour vendors whose pricing, security and specs can be verified without a sales call.","workstreams":["W20"],"owner":"Product marketing","kpi":"b2b.shortlist_rate"},{"id":"A10","priority":10,"horizon":"Now (Q4 2026)","effort":"L","name":"Cover App Intents and connector programs","why_2027":"Siri now requires App Intents and Muse is recruiting connectors. Early integrations get featured and learned by personal agents.","workstreams":["W17"],"owner":"App team","kpi":"protocol.surface.connector_coverage"},{"id":"A11","priority":11,"horizon":"Q1 2027","effort":"L","name":"Segment agent traffic and conversions","why_2027":"Without an agent segment you cannot attribute or defend AXO budgets.","workstreams":["W15"],"owner":"Analytics","kpi":"protocol.access.agent_session_share"},{"id":"A12","priority":12,"horizon":"Q1 2027","effort":"L","name":"Set agent governance and a paid AXO test budget","why_2027":"Disclosure, pricing parity and liability rules are coming. A small budget in ChatGPT feed ads and Sponsored Agents now buys learning before prices rise.","workstreams":["W18","W17"],"owner":"Legal, media and brand","kpi":"policy published; test readouts"}],"metrics_new":[{"key":"geo.share_of_answer.by_surface","definition":"Brand mentions divided by all brand mentions across the probe set, per surface"},{"key":"geo.shortlist_rate.by_surface","definition":"Share of probes where the brand is in the returned shortlist, per surface"},{"key":"protocol.access.verified_agent_pass_rate","definition":"Verified-agent test sessions that reach checkout without a challenge"},{"key":"protocol.access.agent_session_share","definition":"Agent sessions divided by all sessions"},{"key":"protocol.feed.attribute_completeness","definition":"Populated required and recommended attributes divided by applicable attributes, across SKUs"},{"key":"protocol.commerce.protocols_supported","definition":"Count of UCP, ACP, AP2, MCP live in production"},{"key":"protocol.brand_agent.answer_accuracy","definition":"Share of sampled brand-agent answers judged correct against the canonical record"},{"key":"mandate.retention.agent_reorder_rate","definition":"Agent-placed orders that repeat within the category cycle"},{"key":"mandate.switch.loss_rate","definition":"Standing orders lost to a substitute per period"},{"key":"b2b.shortlist_rate","definition":"Share of buyer-agent probes where the vendor is shortlisted"}],"sources":[{"title":"Meta debuts Muse, its long-planned personal AI agent (Axios, 8 Se function openAsk({ projectId, assetIds, question, target, kind, title, auto } = {}) {
  const c = S.chat;
  if (projectId !== undefined && projectId !== c.projectId) { c.projectId = projectId || ""; c.turns = []; }
  c.assetIds = assetIds || [];
  c.target = target || null; c.kind = kind || (target ? c.kind : "llm_answer"); c.title = title || "";
  c.pending = question || "";
  if (c.projectId) watchAssets(c.projectId);
  go("ask");
  if (auto && question) setTimeout(() => send(), 0);
}

function buildInput(question) {
  const c = S.chat;
  const p = project(c.projectId);
  let context = "";
  if (p) {
    context += `\n\n<brand_project>\nName: ${p.name}\nSector: ${p.sector || "unknown"} | Market: ${p.market || "unknown"} | Segment: ${p.segment}\nCompetitors: ${p.competitors || "not set"}\nBrief: ${p.notes || "none"}\n`;
    const sc = ariScore(p.ari);
    if (p.ari && Object.keys(p.ari).length) context += `ARI v2 scores: ${JSON.stringify(p.ari)}${sc != null ? " -> index " + sc : ""}\n`;
    context += "</brand_project>";
  }
  const assets = S.assets.filter((a) => c.assetIds.includes(a.id));
  const assetBlocks = assets.map((a) => { const cur = a.versions[a.versions.length - 1]; return { head: `\n\n<asset title="${a.title}" kind="${a.kind}" version="${cur.v}">\n`, body: cur.content, tail: "\n</asset>" }; });
  const history = c.turns.slice(-8);
  const assemble = (limit) => {
    const intro = `${RULES}\n\n<knowledge_model>\n${KB_TEXT}\n</knowledge_model>${context}` + assetBlocks.map((b) => b.head + b.body.slice(0, limit) + (b.body.length > limit ? "\n[…truncated]" : "") + b.tail).join("");
    return [{ role: "user", content: intro }, ...history, { role: "user", content: question }];
  };
  let limit = 12000, turns = assemble(limit);
  const size = (t) => bytes(t.map((x) => x.content).join(""));
  while (size(turns) > 62000 && history.length) { history.shift(); turns = assemble(limit); }
  while (size(turns) > 62000 && limit > 1500) { limit = Math.floor(limit / 2); turns = assemble(limit); }
  return turns;
}

function renderThread(thread) {
  thread.replaceChildren();
  const t = S.chat.turns;
  for (let i = 0; i < t.length; i++) {
    if (t[i].role === "user") thread.append(h("div", { class: "q" }, t[i].content));
    else thread.append(answerBlock(t[i].content, t[i - 1]?.content || "", i === t.length - 1));
  }
}

  if (c.projectId && S.assets.length) ctx.append(h("div", { class: "label" }, "Include assets"),
    h("div", { class: "chips" }, S.assets.map((a) => h("button", { class: "chip" + (c.assetIds.includes(a.id) ? " on" : ""), type: "button", "aria-pressed": String(c.assetIds.includes(a.id)),
      onclick: () => { c.assetIds = c.assetIds.includes(a.id) ? c.assetIds.filter((x) => x !== a.id) : [...c.assetIds, a.id]; render(); } }, a.title))));
  if (c.target) ctx.append(h("div", { style: "color:var(--highlight);font-size:.84rem" }, `Updating “${c.target.title}”. Save the answer as its next version.`));
  ctx.append(h("div", { class: "faint", style: "font-size:.78rem" }, `Answers use the knowledge model as of ${KB.meta.as_of}. Claude can't browse from here.`));
  out.push(ctx);

  const thread = h("div", { class: "thread", id: "thread" });
  if (!c.turns.length) {
    thread.append(h("div", { class: "suggest" },
      ["What does Meta Muse change for a mid-market DTC brand, and what should it do this quarter?",
       "Explain the Delegation Ladder and where most brands are stuck.",
       "Which three 2027 predictions have the biggest budget implications for an FMCG brand?"].map((q) =>
        h("button", { class: "btn", type: "button", onclick: () => { c.pending = q; send(); } }, q))));
  } else renderThread(thread);
  out.push(thread);

  const ta = h("textarea", { id: "ask-input", placeholder: "Ask about GEO, AXO or your brand…", "aria-label": "Question" }, c.pending || "");
  ta.addEventListener("input", () => { c.pending = ta.value; });
  const sendBtn = h("button", { class: "btn primary", type: "submit", id: "ask-send", disabled: c.busy }, "Send");
  const stopBtn = h("button", { class: "btn", type: "button", id: "ask-stop", hidden: !c.busy, onclick: () => c.ctl?.abort() }, "Stop");
  const newBtn = h("button", { class: "btn ghost small", type: "button", onclick: () => { c.turns = []; c.target = null; render(); } }, "New chat");
  const form = h("form", { class: "composer" }, ta, h("div", { class: "row", style: "justify-content:space-between" }, newBtn, h("div", { class: "row" }, stopBtn, sendBtn)));
  form.addEventListener("submit", (e) => { e.preventDefault(); send(); });
  out.push(form);
  return out;
}

async function send() {
  const c = S.chat;
  const question = (c.pending || "").trim();
  if (!question || c.busy) return;
  if (!S.sample) { if (S.tab === "ask") render(); return; }
  c.busy = true; c.pending = "";
  const input = buildInput(question);
  c.turns.push({ role: "user", content: question });
  render();
  const thread = $("#thread");
  const live = h("div", { class: "a" }, h("div", { class: "thinking" }, "Thinking…"), h("div", { class: "prose" }));
  thread.append(live);
  live.scrollIntoView({ block: "end", behavior: "smooth" });
  c.ctl = new AbortController();
  let frame = 0, latest = "";
  const prose = $(".prose", live);
  try {
    const { text, truncated } = await S.sample(input, {
      signal: c.ctl.signal, cache: false, modelTier: c.deep ? "complex" : "default",
      onText: ({ text }) => {
        latest = text; $(".thinking", live)?.remove();
        if (!frame) frame = requestAnimationFrame(() => { prose.innerHTML = md(latest); frame = 0; });
      },
    });
    c.turns.push({ role: "assistant", content: text + (truncated ? "\n\n*Answer cut short. Ask for less at once.*" : "") });
  } catch (e) {
    const kept = e && e.code !== "refused" ? e.text : "";
    if (kept) c.turns.push({ role: "assistant", content: kept + "\n\n*Interrupted.*" });
    else c.turns.pop();
    c.busy = false; render();
    if (e && e.code !== "cancelled") $("#thread")?.append(h("div", { class: "err" }, sampleErr(e)));
    if (!kept) { c.pending = question; const ta = $("#ask-input"); if (ta) ta.value = question; }
    return;
  } finally { c.busy = false; }
  render();
  const last = $("#thread")?.lastElementChild; last?.scrollIntoView({ block: "start", behavior: "smooth" });
}

// ------------------------------------------------------------------ boot
go("projects");
(async () => {
  if (!window.claude || !window.claude.use) { S.dbReady = true; S.sampleReady = true; render(); return; }
  claude.use("sample").then((s) => { S.sample = s; S.sampleReady = true; if (S.tab === "ask" && !S.chat.busy) render(); });
  const db = await claude.use("db");
  S.db = db; S.dbReady = true;
  if (db) watchProjects(); else render();
})();
</script>

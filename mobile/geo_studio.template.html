<title>GEO Studio</title>
<meta name="description" content="GEO and AXO strategy studio: navigate the model, ask Claude, keep versioned assets per brand.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600&family=Space+Mono:wght@400;700&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Two brand systems, one component set. Both are dark-first by design,
   so the page commits to dark in every viewer theme and paints its own ground. */
:root {
  color-scheme: dark;
  --band-0:#5601a4; --band-1:#9410a2; --band-2:#c43e7f; --band-3:#e76e5b; --band-4:#fca338; --band-5:#f7e425;
  --bg:#000000; --surface:#0b0b0e; --surface-2:#131318; --surface-3:#1c1c22;
  --line:rgba(255,255,255,.10); --line-strong:rgba(255,255,255,.22);
  --text:#ffffff; --text-2:rgba(255,255,255,.86); --muted:rgba(255,255,255,.62); --faint:rgba(255,255,255,.42);
  --accent:var(--band-3); --accent-soft:color-mix(in oklab,var(--band-3) 16%,transparent); --on-accent:#0b0b0e;
  --highlight:var(--band-5); --positive:var(--band-5); --caution:var(--band-4); --critical:#ff6b57;
  --meter:var(--band-3);
  --gradient:linear-gradient(90deg,var(--band-0),var(--band-1) 20%,var(--band-2) 40%,var(--band-3) 60%,var(--band-4) 80%,var(--band-5));
  --gradient-text:linear-gradient(100deg,var(--band-2),var(--band-3),var(--band-4));
  --btn-primary:var(--accent);
  --rung-0:var(--band-0); --rung-1:var(--band-1); --rung-2:var(--band-2); --rung-3:var(--band-3); --rung-4:var(--band-4);
  --font-display:"Space Grotesk",system-ui,sans-serif; --font-body:"Hanken Grotesk",system-ui,sans-serif; --font-mono:"Space Mono",ui-monospace,monospace;
  --track:.2em; --radius:14px; --radius-sm:9px;
  --card-bg:var(--surface-2); --glow:none; --brand-name:"jean-paul · meridian";
}
:root[data-brand="om"] {
  --bg:#03040c; --surface:#0d0d1a; --surface-2:#11132a; --surface-3:#1a1a2e;
  --accent:#4f7ff2; --accent-soft:color-mix(in oklab,#4f7ff2 20%,transparent); --on-accent:#ffffff;
  --highlight:#00d1f9; --positive:#00f65b; --caution:#ff4e09; --critical:#f71735; --meter:#4f7ff2;
  --gradient:linear-gradient(123deg,#4f7ff2 0%,#b0228c 90%); --gradient-text:linear-gradient(123deg,#4f7ff2,#b0228c 90%);
  --btn-primary:linear-gradient(123deg,#4f7ff2 0%,#b0228c 90%);
  --rung-0:#2a3f8f; --rung-1:#4f7ff2; --rung-2:#7a52c0; --rung-3:#b0228c; --rung-4:#00d1f9;
  --font-display:"Instrument Sans",system-ui,sans-serif; --font-body:"Instrument Sans",system-ui,sans-serif; --font-mono:"Instrument Sans",system-ui,sans-serif;
  --track:.12em; --radius:18px; --radius-sm:11px;
  --card-bg:linear-gradient(160deg,rgba(79,127,242,.09),rgba(176,34,140,.05) 70%),#10122a;
  --glow:radial-gradient(70% 40% at 90% -5%,rgba(176,34,140,.35),transparent 70%),radial-gradient(60% 35% at 0% 0%,rgba(79,127,242,.30),transparent 70%);
  --brand-name:"omnicom media";
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);background-image:var(--glow);background-repeat:no-repeat;color:var(--text-2);font:400 15px/1.55 var(--font-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
*,*::before,*::after{box-sizing:border-box}
h1,h2,h3,h4{font-family:var(--font-display);color:var(--text);margin:0;line-height:1.15;letter-spacing:-.01em;text-wrap:balance;font-weight:600}
h1{font-size:clamp(1.7rem,6vw,2.4rem);letter-spacing:-.02em} h2{font-size:1.3rem} h3{font-size:1.05rem}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit}
.label{font:400 .68rem/1.3 var(--font-mono);text-transform:uppercase;letter-spacing:var(--track);color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.grad{background:var(--gradient-text);-webkit-background-clip:text;background-clip:text;color:transparent}
.muted{color:var(--muted)} .faint{color:var(--faint)}

/* shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in oklab,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .rule{height:3px;background:var(--gradient)}
.top-in{display:flex;align-items:center;gap:12px;padding:10px 16px;max-width:880px;margin:0 auto}
.logo{display:flex;align-items:center;gap:8px;min-width:0;color:var(--text);font:600 1.05rem var(--font-display);white-space:nowrap}
.logo i{width:10px;height:10px;border-radius:50%;background:var(--gradient)}
.logo small{font:400 .6rem var(--font-mono);letter-spacing:var(--track);text-transform:uppercase;color:var(--faint)}
.logo small::before{content:var(--brand-name)}
.spacer{flex:1}
.toggle{display:inline-flex;border:1px solid var(--line-strong);border-radius:999px;padding:2px;background:var(--surface)}
.toggle button{border:0;background:transparent;color:var(--muted);font:700 .7rem var(--font-mono);letter-spacing:.08em;padding:5px 11px;border-radius:999px;cursor:pointer}
.toggle button[aria-pressed="true"]{background:var(--gradient);color:#fff}
main{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:18px 110px;display:flex;flex-direction:column;gap:18px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in oklab,var(--surface) 94%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs-in{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:520px;margin:0 auto}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:transparent;color:var(--muted);padding:6px 4px;border-radius:12px;cursor:pointer;font-size:.74rem;font-weight:600}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--text);background:var(--surface-3)}
.tab[aria-current="page"] svg{color:var(--accent)}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-strong);background:transparent;color:var(--text);font-weight:600;font-size:.9rem;padding:9px 15px;border-radius:999px;cursor:pointer;white-space:nowrap;text-decoration:none;min-height:40px}
.btn.primary{background:var(--btn-primary);border-color:transparent;color:var(--on-accent)}
.btn.small{padding:5px 11px;font-size:.8rem;min-height:32px}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn.danger{border-color:var(--critical);color:var(--critical)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.toggle button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:6px}
input[type=text],input[type=url],input[type=search],select,textarea{width:100%;background:var(--surface);color:var(--text);border:1px solid var(--line-strong);border-radius:var(--radius-sm);padding:11px 12px;font:400 16px var(--font-body)}
textarea{resize:vertical;min-height:110px;line-height:1.5}
textarea.code{font:400 14px/1.5 ui-monospace,"Space Mono",monospace;min-height:280px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}

/* surfaces */
.card{background:var(--card-bg);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:10px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line-strong);border-radius:999px;padding:2px 9px;font:400 .66rem var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap;background:transparent;cursor:default}
button.chip{cursor:pointer;font-size:.7rem;padding:5px 11px}
.chip.on,.chip.accent{border-color:var(--accent);color:var(--accent)}
.chip.new{border-color:var(--highlight);color:var(--highlight)}
.chip.high{border-color:var(--positive);color:var(--positive)} .chip.medium{border-color:var(--caution);color:var(--caution)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.scroll-x{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.scroll-x::-webkit-scrollbar{display:none}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%;color:inherit}
.item:last-child{border-bottom:0}
.item .t{color:var(--text);font-weight:600}
.item .s{color:var(--faint);font-size:.8rem}
.item .go{margin-left:auto;color:var(--faint)}
.empty{border:1px dashed var(--line-strong);border-radius:var(--radius);padding:22px;text-align:center;color:var(--muted);font-size:.92rem}
.notice{border:1px solid var(--caution);color:var(--text-2);border-radius:var(--radius-sm);padding:10px 12px;font-size:.88rem}
.err{border:1px solid var(--critical);color:var(--text-2);border-radius:var(--radius-sm);padding:10px 12px;font-size:.88rem}
.back{align-self:flex-start}

/* hero + ladder */
.hero{display:flex;flex-direction:column;gap:10px;padding-top:6px}
.hero p{font-size:1rem;max-width:58ch}
.ladder{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.rung{position:relative;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 9px 11px;overflow:hidden;min-width:0}
.rung::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--c)}
.rung b{display:block;font:700 .7rem var(--font-mono);color:var(--muted)}
.rung span{display:block;color:var(--text);font:600 .9rem var(--font-display);margin-top:2px}
@media (max-width:520px){.ladder{grid-template-columns:repeat(5,minmax(0,1fr))}.rung{padding:9px 6px}.rung span{font-size:.78rem}}
.proj{display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer;color:inherit;font:inherit}
.proj .score{font:600 1.8rem/1 var(--font-display);color:var(--text)}
.ex{color:var(--highlight)}

/* ARI meters */
.meter{display:grid;grid-template-columns:1fr 40px;gap:4px 10px;align-items:center;padding:6px 0}
.meter .n{color:var(--text-2);font-size:.9rem}
.meter .n small{color:var(--faint);font-size:.74rem;margin-left:4px}
.meter .v{text-align:right;color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}
.meter input{grid-column:1/-1;width:100%;accent-color:var(--meter)}
.big{font:600 3rem/1 var(--font-display);color:var(--text);font-variant-numeric:tabular-nums}
.bands{display:grid;grid-template-columns:40fr 20fr 20fr 21fr;gap:2px}
.bands div{height:6px;border-radius:3px;background:var(--surface-3)}
.bands div.on{background:var(--meter)}

/* knowledge */
.k-card .id{font:700 .74rem var(--font-mono);color:var(--accent)}
.k-card p{font-size:.9rem}
.k-card .meta{font-size:.84rem;color:var(--muted)} .k-card .meta b{color:var(--text-2);font-weight:600}
.k-card ul{margin:0;padding-left:18px;font-size:.86rem} .k-card li{margin-bottom:4px}
details summary{cursor:pointer;color:var(--muted);font-size:.84rem}

/* chat */
.thread{display:flex;flex-direction:column;gap:14px}
.q{align-self:flex-end;max-width:88%;background:var(--surface-3);color:var(--text);padding:10px 13px;border-radius:14px 14px 4px 14px;white-space:pre-wrap;font-size:.94rem}
.a{display:flex;flex-direction:column;gap:8px}
.thinking{color:var(--muted);font-size:.86rem;display:flex;gap:8px;align-items:center}
.thinking::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite alternate}
@keyframes pulse{from{opacity:.3}to{opacity:1}}
.save{display:flex;flex-wrap:wrap;gap:8px;padding-top:10px;border-top:1px dashed var(--line)}
.save input{flex:1;min-width:150px;padding:8px 10px;font-size:15px}
.composer{position:sticky;bottom:calc(74px + env(safe-area-inset-bottom,0px));background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius);padding:10px;display:flex;flex-direction:column;gap:8px;z-index:5}
.composer textarea{min-height:64px;border:0;background:transparent;padding:4px}
.suggest{display:flex;flex-direction:column;gap:6px}
.suggest button{text-align:left;justify-content:flex-start;white-space:normal;border-radius:var(--radius-sm)}

/* prose */
.prose{color:var(--text-2);font-size:.95rem;overflow-wrap:anywhere}
.prose h1{font-size:1.5rem;margin:.8em 0 .4em} .prose h2{font-size:1.2rem;margin:1.2em 0 .4em} .prose h3{font-size:1.02rem;margin:1em 0 .3em}
.prose p{margin:0 0 .8em} .prose ul,.prose ol{padding-left:1.2em;margin:0 0 .8em} .prose li{margin-bottom:.3em}
.prose strong{color:var(--text)}
.prose table{border-collapse:collapse;font-size:.84rem;display:block;overflow-x:auto;margin:0 0 1em;max-width:100%}
.prose th{text-align:left;color:var(--muted);border-bottom:1px solid var(--line-strong);padding:6px 8px;white-space:nowrap}
.prose td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top;min-width:110px}
.prose code{font-size:.85em;background:var(--surface-3);padding:.1em .3em;border-radius:4px}
.prose pre{background:var(--surface);border:1px solid var(--line);padding:10px;border-radius:8px;overflow-x:auto}
.prose blockquote{margin:0 0 .8em;padding:.2em .9em;border-left:3px solid var(--accent);color:var(--muted)}
.versions{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
@media (max-width:440px){.logo small{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header class="top">
  <div class="rule"></div>
  <div class="top-in">
    <div class="logo"><i></i>GEO Studio <small></small></div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>

<script>
"use strict";
const KB = /*__KNOWLEDGE__*/null;

const KINDS = {readiness_brief:"Readiness brief",action_plan:"Action plan",probe_set:"Probe set",surface_memo:"Surface memo",strategy:"Strategy",audit:"Audit",research:"Research",llm_answer:"Claude answer",note:"Note"};
const KITS = [
  ["readiness_brief","Agent readiness brief","ARI v2 read, the 3 cheapest moves, per-surface snapshot.",
   "Write a one-page agent readiness brief for this brand: an ARI v2 read by component (use my scores if set, otherwise state assumptions and what evidence to gather), the three cheapest moves to raise it, and a per-surface snapshot for Muse, ChatGPT, Google AI Mode, Alexa, Siri and Copilot. Tag each move with layer, arena, rung and workstream."],
  ["action_plan","2027 action plan","A1–A12 tailored, quarter by quarter.",
   "Build this brand's 2027 GEO/AXO action plan: tailor actions A1–A12 to the brand and sector, rank them, and lay them out quarter by quarter from Q4 2026 to Q4 2027 with owner, KPI and target. Flag which predictions (P1–P12) each action hedges."],
  ["probe_set","Probe set","40 fixed prompts across intents and surfaces.",
   "Create a 40-prompt probe set for this brand covering the 7 LDOS intent classes plus delegated purchase, standing mandate and (if relevant) buyer-agent B2B. Include the run protocol, surfaces, repetitions and extraction fields as a table."],
  ["surface_memo","Muse memo","What Meta Muse means for this brand.",
   "Write a surface memo: what Meta Muse means for this brand, how Muse will discover, compare and buy in this category, what blocks the brand today, the 90-day plan, and how to measure progress."],
  ["strategy","Mandate strategy","Win and keep the default once people delegate.",
   "Design the Mandate-layer strategy (W19) for this brand: map the mandate moments in the category, the structured standing options to offer, the reliability evidence agents will audit, and the switch signals to monitor."],
  ["audit","Agent access audit","W15 checklist with pass criteria.",
   "Produce a W15 agent access and identity audit checklist tailored to this brand: CDN and WAF defaults, verified agents (Visa TAP, Mastercard Agent Pay, Web Bot Auth), crawler classes, analytics segmentation, and a draft agent policy. Give each check a pass criterion."],
];
const RULES = `You are the strategist inside GEO Studio, a workspace for generative engine optimisation (GEO) and agentic experience optimisation (AXO). You advise brand, media and ecommerce leaders on how to be found, chosen, bought and re-bought when the buyer is an AI answer engine or an agent acting for a person (Meta Muse, ChatGPT, Gemini and AI Mode, Siri AI, Alexa for Shopping, Copilot, B2B buying agents).

Ground every answer in the knowledge model below (as of ${KB.meta.as_of}). Tag recommendations with layer (Entity, Surface, Protocol, Mandate), arena (Eligibility, Justification, Defaults) and Delegation rung (D0-D4) where useful, and cite workstream, prediction and action IDs (W15, P3, A2). Date landscape claims. Separate paid from earned. State uncertainty plainly; never promise placement in any AI answer. You cannot browse: say when something may have changed since the as-of date. When the brand context is thin, say what data would change the recommendation. Write clear, structured markdown for a phone screen: short headings, short tables only where they compare, and a closing "Next moves" list with owner and KPI when giving advice.`;

const KB_TEXT = JSON.stringify(Object.fromEntries(Object.entries(KB).filter(([k]) => k !== "sources")));

// ------------------------------------------------------------------ helpers
const $ = (s, el = document) => el.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "html") el.innerHTML = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : String(kid));
  return el;
}
function md(text) {
  try { if (window.marked && window.DOMPurify) return DOMPurify.sanitize(marked.parse(text || "")); } catch (e) {}
  return miniMd(text || "");
}
// Fallback when the CDN libraries can't load: escapes everything first, then formats
// headings, bold/italic/code, lists, tables and paragraphs. Emits no links or raw HTML.
function miniMd(src) {
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const inline = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/(^|\W)\*([^*]+)\*(?=\W|$)/g, "$1<em>$2</em>");
  const lines = src.split(/\r?\n/); const out = []; let i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (!l.trim()) { i++; continue; }
    let m;
    if ((m = l.match(/^(#{1,4})\s+(.*)/))) { const n = Math.min(m[1].length + 1, 4); out.push(`<h${n}>${inline(m[2])}</h${n}>`); i++; continue; }
    if (/^\s*\|/.test(l) && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1] || "")) {
      const cells = (r) => r.trim().replace(/^\||\|$/g, "").split("|").map((c) => inline(c.trim()));
      let html = "<table><thead><tr>" + cells(l).map((c) => `<th>${c}</th>`).join("") + "</tr></thead><tbody>"; i += 2;
      while (i < lines.length && /^\s*\|/.test(lines[i])) { html += "<tr>" + cells(lines[i]).map((c) => `<td>${c}</td>`).join("") + "</tr>"; i++; }
      out.push(html + "</tbody></table>"); continue;
    }
    if (/^\s*([-*]|\d+\.)\s+/.test(l)) {
      const ordered = /^\s*\d+\./.test(l); const items = [];
      while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) { items.push(`<li>${inline(lines[i].replace(/^\s*([-*]|\d+\.)\s+/, ""))}</li>`); i++; }

function askBtn(q) { return h("button", { class: "btn small", type: "button", onclick: () => openAsk({ question: q }) }, "Ask →"); }
function kCard(text, ...kids) { const c = h("div", { class: "card k-card" }, ...kids); c.dataset.text = text.toLowerCase(); return c; }
function kItems(section) {
  switch (section) {
    case "ladder": return [
      ...KB.delegation_ladder.map((r, i) => kCard(JSON.stringify(r), h("div", { class: "row" }, h("span", { class: "id", style: `color:var(--rung-${i === 0 ? 1 : i})` }, r.rung), h("h3", {}, r.name)), h("p", {}, r.description), h("p", { class: "meta" }, h("b", {}, "Wins "), r.what_wins), h("p", { class: "meta" }, r.example))),
      ...KB.layers.map((l) => kCard(JSON.stringify(l), h("div", { class: "row" }, h("h3", {}, l.name), l.new_in ? h("span", { class: "chip new" }, "new") : null), h("p", {}, h("b", { style: "color:var(--text)" }, l.question)), h("p", { class: "meta" }, h("b", {}, "Failure "), l.failure)))];
    case "concepts": return KB.concepts.map((c) => kCard(c.name + c.idea, h("h3", {}, c.name), h("p", {}, c.idea), h("div", {}, askBtn(`Explain '${c.name}' and what it means for a brand in practice, with two examples.`))));
    case "workstreams": return KB.workstreams.map((w) => kCard(JSON.stringify(w),
      h("div", { class: "row" }, h("span", { class: "id" }, w.id), w.new_in ? h("span", { class: "chip new" }, "new") : null, h("span", { class: "chip" }, w.layer), h("span", { class: "chip" }, w.arena)),
      h("h3", {}, w.name), h("p", {}, w.summary),
      w.tasks ? h("details", {}, h("summary", {}, `${w.tasks.length} tasks`), h("ul", {}, w.tasks.map((t) => h("li", {}, t)))) : null,
      h("div", {}, askBtn(`Run ${w.id} (${w.name}) for a brand: what to check first, what good looks like, and the three cheapest moves.`))));
    case "surfaces": return KB.surfaces.map((s) => kCard(JSON.stringify(s),
      h("div", { class: "row" }, h("span", { class: "id" }, s.owner), h("span", { class: "chip" }, s.segment), s.launched ? h("span", { class: "chip" }, s.launched) : null),
      h("h3", {}, s.name), h("p", {}, s.how_it_works),
      h("details", {}, h("summary", {}, "Commerce, reach, paid, levers"), h("p", { class: "meta" }, h("b", {}, "Commerce "), s.commerce), h("p", { class: "meta" }, h("b", {}, "Reach "), s.reach), h("p", { class: "meta" }, h("b", {}, "Paid "), s.paid), h("p", { class: "meta" }, h("b", {}, "Brand levers "), s.brand_levers)),
      h("div", {}, askBtn(`Write a surface memo: what ${s.name} means for a brand, what to do in the next 90 days and how to measure it.`))));
    case "protocols": return KB.protocols.map((p) => kCard(JSON.stringify(p), h("span", { class: "id" }, p.owner), h("h3", {}, p.name), h("p", { class: "meta" }, h("b", {}, "Covers "), p.layer), h("p", { class: "meta" }, h("b", {}, "Status "), p.status), h("p", { class: "meta" }, h("b", {}, "Do "), p.action)));
    case "ari": return [kCard("ari " + KB.ari.note, h("h3", {}, KB.ari.name), h("p", { class: "meta" }, KB.ari.note),
      KB.ari.components.map((c) => h("div", { class: "meter" }, h("span", { class: "n" }, c.name, h("small", {}, c.measures)), h("span", { class: "v" }, c.weight))),
      h("p", { class: "meta" }, "Weights sum to 100. Bands: " + KB.ari.bands.map((b) => `${b.min}–${b.max} ${b.label}`).join(" · ")))];
    case "predictions": return KB.predictions.map((p) => kCard(JSON.stringify(p),
      h("div", { class: "row" }, h("span", { class: "id" }, `${p.id} · ${p.horizon}`), h("span", { class: "chip " + p.confidence }, p.confidence)),
      h("p", { style: "color:var(--text)" }, p.statement), h("p", { class: "meta" }, h("b", {}, "Watch "), p.signals), h("p", { class: "meta" }, h("b", {}, "So what "), p.implication),
      h("div", {}, askBtn(`Stress-test prediction ${p.id}: ${p.statement} What evidence is there, what would falsify it, and what should a brand do if it comes true?`))));
    case "actions": return KB.actions.map((a) => kCard(JSON.stringify(a),
      h("div", { class: "row" }, h("span", { class: "id" }, a.id), h("span", { class: "chip" }, a.horizon), h("span", { class: "chip" }, "effort " + a.effort)),
      h("h3", {}, a.name), h("p", {}, a.why_2027), h("p", { class: "meta" }, h("b", {}, "Owner "), a.owner, " · ", h("b", {}, "KPI "), a.kpi),
      h("div", {}, askBtn(`Turn action ${a.id} (${a.name}) into a 6-week plan with owners, milestones and a KPI target.`))));
  }
  return [];
}
function viewKnowledge() {
  const search = h("input", { type: "search", id: "k-search", placeholder: "Search: Muse, mandate, UCP, W16…", value: S.kQuery, "aria-label": "Search knowledge" });
  const body = h("div", { style: "display:flex;flex-direction:column;gap:12px" });
  const fill = () => {
    const q = S.kQuery.trim().toLowerCase();
    const sections = q ? K_SECTIONS.map(([id]) => id) : [S.kSection];
    const items = sections.flatMap((id) => kItems(id)).filter((el) => !q || el.dataset.text.includes(q));
    body.replaceChildren(...(items.length ? items : [h("div", { class: "empty" }, "Nothing matches that search.")]));
  };
  search.addEventListener("input", () => { S.kQuery = search.value; chips.hidden = !!S.kQuery.trim(); fill(); });
  const chips = h("div", { class: "scroll-x", role: "tablist" }, K_SECTIONS.map(([id, label]) =>
    h("button", { class: "chip" + (S.kSection === id ? " on" : ""), type: "button", role: "tab", "aria-selected": String(S.kSection === id), onclick: () => { S.kSection = id; render(); } }, label)));
  chips.hidden = !!S.kQuery.trim();
  fill();
  return [
    h("div", {}, h("div", { class: "label" }, `Knowledge model v${KB.meta.version} · ${KB.meta.as_of}`), h("h1", {}, "Navigate GEO and AXO")),
    search, chips, body];
}

// ------------------------------------------------------------------ ask
function openAsk({ projectId, assetIds, question, target, kind, title, auto } = {}) {
  const c = S.chat;
  if (projectId !== undefined && projectId !== c.projectId) { c.projectId = projectId || ""; c.turns = []; }
  c.assetIds = assetIds || [];
  c.target = target || null; c.kind = kind || (target ? c.kind : "llm_answer"); c.title = title || "";
  c.pending = question || "";
  if (c.projectId) watchAssets(c.projectId);
  go("ask");
  if (auto && question) setTimeout(() => send(), 0);
}

function buildInput(question) {
  const c = S.chat;
  const p = project(c.projectId);
  let context = "";
  if (p) {
    context += `\n\n<brand_project>\nName: ${p.name}\nSector: ${p.sector || "unknown"} | Market: ${p.market || "unknown"} | Segment: ${p.segment}\nCompetitors: ${p.competitors || "not set"}\nBrief: ${p.notes || "none"}\n`;
    const sc = ariScore(p.ari);
    if (p.ari && Object.keys(p.ari).length) context += `ARI v2 scores: ${JSON.stringify(p.ari)}${sc != null ? " -> index " + sc : ""}\n`;
    context += "</brand_project>";
  }
  const assets = S.assets.filter((a) => c.assetIds.includes(a.id));
  const assetBlocks = assets.map((a) => { const cur = a.versions[a.versions.length - 1]; return { head: `\n\n<asset title="${a.title}" kind="${a.kind}" version="${cur.v}">\n`, body: cur.content, tail: "\n</asset>" }; });
  const history = c.turns.slice(-8);
  const assemble = (limit) => {
    const intro = `${RULES}\n\n<knowledge_model>\n${KB_TEXT}\n</knowledge_model>${context}` + assetBlocks.map((b) => b.head + b.body.slice(0, limit) + (b.body.length > limit ? "\n[…truncated]" : "") + b.tail).join("");
    return [{ role: "user", content: intro }, ...history, { role: "user", content: question }];
  };
  let limit = 12000, turns = assemble(limit);
  const size = (t) => bytes(t.map((x) => x.content).join(""));
  while (size(turns) > 62000 && history.length) { history.shift(); turns = assemble(limit); }
  while (size(turns) > 62000 && limit > 1500) { limit = Math.floor(limit / 2); turns = assemble(limit); }
  return turns;
}

function renderThread(thread) {
  thread.replaceChildren();
  const t = S.chat.turns;
  for (let i = 0; i < t.length; i++) {
    if (t[i].role === "user") thread.append(h("div", { class: "q" }, t[i].content));
    else thread.append(answerBlock(t[i].content, t[i - 1]?.content || "", i === t.length - 1));
  }
}
function answerBlock(text, question, isLast) {
  const a = h("div", { class: "a" }, h("div", { class: "prose", html: md(text) }));
  if (isLast) a.append(saveControls(text, question));
  return a;
}
function saveControls(text, question) {
  const c = S.chat;
  const box = h("div", { class: "save" });
  if (!S.db) { box.append(h("span", { class: "faint", style: "font-size:.82rem" }, "Saving needs storage, which isn't available in this view.")); return box; }
  if (!c.projectId) { box.append(h("span", { class: "faint", style: "font-size:.82rem" }, "Choose a project above to save this answer.")); return box; }
  const btn = h("button", { class: "btn small primary", type: "button" }, c.target ? `Save as new version of “${c.target.title}”` : "Save to project");
  const title = h("input", { type: "text", id: "save-title", value: c.title || question.slice(0, 80), "aria-label": "Asset title" });
  if (!c.target) box.append(title);
  box.append(btn);
  btn.addEventListener("click", async () => {
    btn.disabled = true; btn.textContent = "Saving…";
    try {
      let aid;
      if (c.target) {
        const a = S.assets.find((x) => x.id === c.target.id);
        await addVersion(c.projectId, a, { content: text, source: "claude", note: "Updated by Claude: " + question.slice(0, 100) });
        aid = a.id;
      } else aid = await createAsset(c.projectId, { title: title.value.trim() || question.slice(0, 80), kind: c.kind, content: text, source: "claude", note: "From: " + question.slice(0, 100) });
      const pid = c.projectId;
      box.replaceChildren(h("span", { style: "font-size:.88rem" }, "Saved. "), h("button", { class: "btn small", type: "button", onclick: () => go("projects", { name: "asset", pid, aid }) }, "Open asset →"));
    } catch (e) { btn.disabled = false; btn.textContent = "Save failed. Try again"; }
  });
  return box;
}

function viewAsk() {
  const c = S.chat;
  const out = [h("div", {}, h("div", { class: "label" }, "Live strategist"), h("h1", {}, "Ask Claude"))];
  if (S.sampleReady && !S.sample) out.push(h("div", { class: "notice" }, "Claude isn't available in this view. Open the page in the Claude app or claude.ai while signed in."));

  const sel = h("select", { id: "ask-project", "aria-label": "Brand project" }, h("option", { value: "" }, "No project (general)"),
    S.projects.map((p) => h("option", { value: p.id, selected: p.id === c.projectId }, p.name)));
  sel.addEventListener("change", () => { c.projectId = sel.value; c.assetIds = []; c.target = null; c.turns = []; watchAssets(c.projectId || null); render(); });
  const depth = h("div", { class: "toggle", role: "group", "aria-label": "Answer depth" },
    h("button", { type: "button", id: "depth-std", "aria-pressed": String(!c.deep), onclick: () => { c.deep = false; render(); } }, "STANDARD"),
    h("button", { type: "button", id: "depth-deep", "aria-pressed": String(c.deep), onclick: () => { c.deep = true; render(); } }, "DEEP"));
  const ctx = h("div", { class: "card", style: "gap:10px" }, h("div", { class: "row" }, sel), h("div", { class: "row", style: "justify-content:space-between" }, h("span", { class: "label" }, "Depth"), depth));
  if (c.projectId && S.assets.length) ctx.append(h("div", { class: "label" }, "Include assets"),
    h("div", { class: "chips" }, S.assets.map((a) => h("button", { class: "chip" + (c.assetIds.includes(a.id) ? " on" : ""), type: "button", "aria-pressed": String(c.assetIds.includes(a.id)),
      onclick: () => { c.assetIds = c.assetIds.includes(a.id) ? c.assetIds.filter((x) => x !== a.id) : [...c.assetIds, a.id]; render(); } }, a.title))));
  if (c.target) ctx.append(h("div", { style: "color:var(--highlight);font-size:.84rem" }, `Updating “${c.target.title}”. Save the answer as its next version.`));
  ctx.append(h("div", { class: "faint", style: "font-size:.78rem" }, `Answers use the knowledge model as of ${KB.meta.as_of}. Claude can't browse from here.`));
  out.push(ctx);

  const thread = h("div", { class: "thread", id: "thread" });
  if (!c.turns.length) {
    thread.append(h("div", { class: "suggest" },
      ["What does Meta Muse change for a mid-market DTC brand, and what should it do this quarter?",
       "Explain the Delegation Ladder and where most brands are stuck.",
       "Which three 2027 predictions have the biggest budget implications for an FMCG brand?"].map((q) =>
        h("button", { class: "btn", type: "button", onclick: () => { c.pending = q; send(); } }, q))));
  } else renderThread(thread);
  out.push(thread);

  const ta = h("textarea", { id: "ask-input", placeholder: "Ask about GEO, AXO or your brand…", "aria-label": "Question" }, c.pending || "");
  ta.addEventListener("input", () => { c.pending = ta.value; });
  const sendBtn = h("button", { class: "btn primary", type: "submit", id: "ask-send", disabled: c.busy }, "Send");
  const stopBtn = h("button", { class: "btn", type: "button", id: "ask-stop", hidden: !c.busy, onclick: () => c.ctl?.abort() }, "Stop");
  const newBtn = h("button", { class: "btn ghost small", type: "button", onclick: () => { c.turns = []; c.target = null; render(); } }, "New chat");
  const form = h("form", { class: "composer" }, ta, h("div", { class: "row", style: "justify-content:space-between" }, newBtn, h("div", { class: "row" }, stopBtn, sendBtn)));
  form.addEventListener("submit", (e) => { e.preventDefault(); send(); });
  out.push(form);
  return out;
}

async function send() {
  const c = S.chat;
  const question = (c.pending || "").trim();
  if (!question || c.busy) return;
  if (!S.sample) { if (S.tab === "ask") render(); return; }
  c.busy = true; c.pending = "";
  const input = buildInput(question);
  c.turns.push({ role: "user", content: question });
  render();
  const thread = $("#thread");
  const live = h("div", { class: "a" }, h("div", { class: "thinking" }, "Thinking…"), h("div", { class: "prose" }));
  thread.append(live);
  live.scrollIntoView({ block: "end", behavior: "smooth" });
  c.ctl = new AbortController();
  let frame = 0, latest = "";
  const prose = $(".prose", live);
  try {
    const { text, truncated } = await S.sample(input, {
      signal: c.ctl.signal, cache: false, modelTier: c.deep ? "complex" : "default",
      onText: ({ text }) => {
        latest = text; $(".thinking", live)?.remove();
        if (!frame) frame = requestAnimationFrame(() => { prose.innerHTML = md(latest); frame = 0; });
      },
    });
    c.turns.push({ role: "assistant", content: text + (truncated ? "\n\n*Answer cut short. Ask for less at once.*" : "") });
  } catch (e) {
    const kept = e && e.code !== "refused" ? e.text : "";
    if (kept) c.turns.push({ role: "assistant", content: kept + "\n\n*Interrupted.*" });
    else c.turns.pop();
    c.busy = false; render();
    if (e && e.code !== "cancelled") $("#thread")?.append(h("div", { class: "err" }, sampleErr(e)));
    if (!kept) { c.pending = question; const ta = $("#ask-input"); if (ta) ta.value = question; }
    return;
  } finally { c.busy = false; }
  render();
  const last = $("#thread")?.lastElementChild; last?.scrollIntoView({ block: "start", behavior: "smooth" });
}

// ------------------------------------------------------------------ boot
go("projects");
(async () => {
  if (!window.claude || !window.claude.use) { S.dbReady = true; S.sampleReady = true; render(); return; }
  claude.use("sample").then((s) => { S.sample = s; S.sampleReady = true; if (S.tab === "ask" && !S.chat.busy) render(); });
  const db = await claude.use("db");
  S.db = db; S.dbReady = true;
  if (db) watchProjects(); else render();
})();
</script>

{% extends "base.html" %}
{% block title %}Growth Grids - Intent Planner{% endblock %}
{% block content %}
<hgroup>
    <h1>Growth Grids</h1>
    <p>Target no one. Serve every moment. Be the default for machines.</p>
</hgroup>

<details>
    <summary role="button" class="outline">+ New Grid</summary>
    <form hx-post="/grids" hx-target="#grid-list" hx-swap="innerHTML"
          hx-on::after-request="if (event.detail.successful) this.reset()">
        <div class="grid">
            <input type="text" name="brand" placeholder="Brand" required>
            <input type="text" name="market" placeholder="Market (e.g. UK)" required>
            <input type="text" name="category" placeholder="Category" required>
        </div>
        <input type="text" name="notes" placeholder="Notes (optional)">
        <button type="submit">Create</button>
    </form>
</details>

<div id="grid-list">
    {% include "partials/grid_list.html" %}
</div>
{% endblock %}

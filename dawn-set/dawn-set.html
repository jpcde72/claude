<title>Dawn Set</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,300;1,9..144,400&family=Space+Mono&display=swap">
<style>
  :root { color-scheme: dark; --bg: #0A0A0A; }
  html, body { height: 100%; margin: 0; background: var(--bg); overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; cursor: pointer; }
</style>
<canvas aria-label="Thirty-second animation with music: a record rises over a dark sea like the sun,
 its grooves filling with arpeggio notes, until at the drop it turns into the sun and the line
 'Last record. First light.' appears."></canvas>
<audio id="track" src="dawn-set.m4a" preload="auto"></audio>
<script>
// Dawn Set: the third piece, after Residue and First Light.
// The last record of the night, played at sunrise. The record turns once per bar,
// so every note is stamped where the needle is and then carried round; a
// repeating arpeggio builds a rosette. At the drop the record becomes the sun.
// The music comes from the same score as the picture (see SCORE below).

const PAL = ['#4B2E83', '#7B3FAB', '#C026A0', '#F05A28', '#F78DA7', '#FFCC00'];
const SW = 1920, SH = 1080, HORIZON = 760, CX = 960, R = 260, BAR = 2, S16 = BAR / 16, DROP = 20;
const cv = document.querySelector('canvas'), g = cv.getContext('2d'), track = document.getElementById('track');
const hash = (a, b) => { let h = Math.imul(a, 374761393) + Math.imul(b, 668265263) | 0;
  h = Math.imul(h ^ h >>> 13, 1274126177); return ((h ^ h >>> 16) >>> 0) / 4294967296; };
const clamp = v => Math.min(1, Math.max(0, v)), ramp = (a, b, t) => clamp((t - a) / (b - a));
const ease = x => x * x * (3 - 2 * x);
const rgba = (hex, a) => `rgba(${parseInt(hex.slice(1, 3), 16)},${parseInt(hex.slice(3, 5), 16)},${parseInt(hex.slice(5, 7), 16)},${a})`;

// The score: 120 BPM, fifteen bars. Am F C G through the night, then F G C C at sunrise.
const NIGHT = [[57, 60, 64], [53, 57, 60], [55, 60, 64], [55, 59, 62]];
const DAWN = [[53, 57, 60, 64], [55, 59, 62, 67], [55, 60, 64, 67], [55, 60, 64, 72]];
const ARP = [0, 1, 2, 3, 4, 3, 2, 1, 0, 2, 4, 5, 4, 2, 1, 2], ACCENT = new Set([0, 3, 6, 8, 11, 14]);
const SCORE = [];
const add = (type, t, pitch, vel, dur) => SCORE.push({ type, t, pitch, vel, dur });
for (let b = 0; b < 15; b++) {
  const t0 = b * BAR, dawn = b >= 10, chord = b === 14 ? [48, 55, 60, 64, 67] : dawn ? DAWN[b - 10] : NIGHT[b % 4];
  const drums = (b >= 4 && b <= 8) || (b >= 10 && b <= 13);
  add('pad', t0, chord, drums ? 0.6 : 0.9, b === 14 ? 2 : BAR);
  if (b < 14) for (let s = 0; s < 16; s++) {
    const tones = [...chord, ...chord.map(p => p + 12)], p = tones[ARP[s] % tones.length] + (dawn ? 12 : 0);
    const fade = b === 0 ? 0.35 + 0.65 * s / 16 : 1;
    if (b === 9 && s >= 8) continue;
    add('arp', t0 + s * S16, p, (ACCENT.has(s) ? 1 : 0.6) * fade, S16 * 1.5);
  }
  if (drums) for (let k = 0; k < 4; k++) {
    add('kick', t0 + k * 0.5, 36, 1, 0.4);
    add('hat', t0 + k * 0.5 + 0.25, 0, 0.8, 0.08);
    add('bass', t0 + k * 0.5 + 0.25, chord[0] - 24, 0.9, 0.2);
    if (dawn && k % 2) add('clap', t0 + k * 0.5, 0, 0.9, 0.2);
  }
  if (dawn) for (const s of [0, 3, 6, 10, 12]) add('stab', t0 + s * S16, chord.map(p => p + 12), s ? 0.7 : 1, 0.35);
  if (b === 9) { add('riser', t0, 0, 1, BAR);
    for (let s = 8; s < 16; s++) add('clap', t0 + s * S16, 0, 0.3 + 0.6 * (s - 8) / 8, 0.1); }
}
add('stab', 28, [60, 64, 67, 72, 76], 1, 2);
window.SCORE = SCORE;

const stars = Array.from({ length: 220 }, (_, i) => ({ x: SW * hash(i, 11), y: HORIZON * hash(i, 12) ** 1.4,
  r: 0.4 + hash(i, 13), p: hash(i, 14) }));
const colourAt = t => PAL[t < 8 ? (t < 4 ? 0 : 1) : t < 18 ? (t < 13 ? 2 : 3) : t < DROP ? 4 : 5];
const clockAt = t => { const m = 58 + Math.floor(t / 30 * 44); return `0${4 + Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`; };

let scale = 1, offX = 0, offY = 0;
function fit() {
  const d = devicePixelRatio || 1; cv.width = innerWidth * d; cv.height = innerHeight * d;
  scale = Math.min(innerWidth / SW, innerHeight / SH) * d;
  offX = (cv.width - SW * scale) / 2; offY = (cv.height - SH * scale) / 2;
}
function text(s, x, y, font, color, align = 'left', spacing = '0px') {
  g.font = font; g.fillStyle = color; g.textAlign = align; g.letterSpacing = spacing; g.fillText(s, x, y); g.letterSpacing = '0px';
}
const recent = (type, t, span) => SCORE.filter(e => e.type === type && e.t <= t && t - e.t < span);

function record(t, cy, sun, pulse) {
  const spin = 2 * Math.PI * t / BAR;
  // Body: vinyl before the drop, the sun after it.
  const body = g.createRadialGradient(CX, cy, 0, CX, cy, R * pulse);
  body.addColorStop(0, sun > 0 ? rgba(PAL[5], sun) : '#181818');
  body.addColorStop(0.75, sun > 0 ? rgba(PAL[5], sun) : '#121212');
  body.addColorStop(1, sun > 0 ? rgba(PAL[4], sun) : '#0E0E0E');
  g.fillStyle = '#111111'; g.beginPath(); g.arc(CX, cy, R * pulse, 0, 6.29); g.fill();
  g.fillStyle = body; g.fill();
  // Grooves and a turning sheen.
  for (let k = 0; k < 34; k++) {
    g.strokeStyle = sun > 0.5 ? `rgba(240,90,40,${0.18 * sun})` : `rgba(255,255,255,${0.035 + 0.02 * (k % 3 === 0)})`;
    g.lineWidth = 1; g.beginPath(); g.arc(CX, cy, (96 + k * 4.7) * pulse, 0, 6.29); g.stroke();
  }
  for (const off of [0, Math.PI]) {
    g.fillStyle = `rgba(255,255,255,${0.05 * (1 - sun)})`; g.beginPath(); g.moveTo(CX, cy);
    g.arc(CX, cy, R * pulse, spin * 0.25 + off, spin * 0.25 + off + 0.35); g.closePath(); g.fill();
  }
  // Notes, stamped under the needle at twelve o'clock and carried round by the spin.
  for (const e of SCORE) {
    if (e.type !== 'arp' || e.t > t || t - e.t > BAR * 4) continue;
    const age = t - e.t, a = -Math.PI / 2 + 2 * Math.PI * age / BAR, r = (110 + (e.pitch - 50) * 3.6) * pulse;
    const fresh = Math.exp(-age * 5), col = colourAt(e.t);
    g.fillStyle = rgba(sun > 0.5 ? PAL[3] : col, (0.35 + 0.65 * fresh) * (1 - age / (BAR * 4)) * e.vel);
    g.beginPath(); g.arc(CX + Math.cos(a) * r, cy + Math.sin(a) * r, 2.4 + 5 * fresh * e.vel, 0, 6.29); g.fill();
  }
  // Bass notes as short thick arcs on the inner groove.
  for (const e of recent('bass', t, BAR)) {
    const age = t - e.t, a = -Math.PI / 2 + 2 * Math.PI * age / BAR;
    g.strokeStyle = rgba(sun > 0.5 ? PAL[2] : colourAt(e.t), 0.8 * (1 - age / BAR));
    g.lineWidth = 6; g.lineCap = 'round'; g.beginPath(); g.arc(CX, cy, 96 * pulse, a - 0.35, a); g.stroke();
  }
  // Label, with its text turning with the record.
  g.fillStyle = sun > 0 ? rgba(PAL[3], 0.6 + 0.4 * sun) : colourAt(t);
  g.beginPath(); g.arc(CX, cy, 74 * pulse, 0, 6.29); g.fill();
  g.fillStyle = '#0A0A0A'; g.beginPath(); g.arc(CX, cy, 5, 0, 6.29); g.fill();
  g.save(); g.translate(CX, cy); g.rotate(spin);
  g.font = '400 11px "Space Mono", "Courier New", monospace'; g.fillStyle = 'rgba(10,10,10,0.75)'; g.textAlign = 'center';
  const label = 'LAST RECORD · 120 BPM · SIDE A · ';
  for (let i = 0; i < label.length; i++) { g.save(); g.rotate(i / label.length * 2 * Math.PI); g.fillText(label[i], 0, -54 * pulse); g.restore(); }
  g.restore();
}

function frame(t) {
  g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = '#0A0A0A'; g.fillRect(0, 0, cv.width, cv.height);
  g.setTransform(scale, 0, 0, scale, offX, offY);
  g.save(); g.beginPath(); g.rect(0, 0, SW, SH); g.clip();
  const open = ease(ramp(0, 1.5, t)), sun = ease(ramp(DROP - 0.4, DROP + 0.6, t)), riser = ramp(18, DROP, t);
  const cy = HORIZON + 170 - ease(ramp(0, DROP, t)) * 450;
  const kick = recent('kick', t, 0.5).reduce((s, e) => s + Math.exp(-(t - e.t) * 12), 0);
  const pulse = 1 + 0.022 * kick;
  const warm = 0.12 + 0.35 * ramp(0, DROP, t) + 0.5 * sun + 0.15 * riser;

  // Sky: latitude order outward from the record.
  g.globalAlpha = open;
  const sky = g.createRadialGradient(CX, Math.max(cy, 300), R * 0.8, CX, Math.max(cy, 300), 1300);
  [5, 4, 3, 2, 1, 0].forEach((c, i) => sky.addColorStop(i / 6, rgba(PAL[c], (c >= 4 ? sun * 0.8 + riser * 0.2 : 1) * warm * (0.35 - i * 0.04) * (1 + 0.25 * kick))));
  sky.addColorStop(1, 'rgba(10,10,10,0)');
  g.fillStyle = sky; g.fillRect(0, 0, SW, HORIZON);
  const hats = recent('hat', t, 0.25);
  for (const [i, s] of stars.entries()) {
    const tw = hats.length && hash(i, Math.round(hats[0].t * 8)) < 0.2 ? 1 : 0.45;
    g.fillStyle = `rgba(255,255,255,${tw * 0.7 * (1 - sun) * (1 - s.y / HORIZON * 0.5)})`;
    g.beginPath(); g.arc(s.x, s.y, s.r, 0, 6.29); g.fill();
  }

  // Sunbeams on the piano stabs, a ring on each clap.
  for (const e of recent('stab', t, 1.2)) {
    const age = t - e.t, f = Math.exp(-age * 4) * e.vel;
    for (let k = 0; k < 48; k++) {
      const a = k / 48 * 2 * Math.PI + e.t, len = (120 + 260 * hash(k, Math.round(e.t * 8))) * f;
      g.strokeStyle = rgba(k % 3 ? PAL[4] : PAL[5], 0.5 * f); g.lineWidth = 2;
      g.beginPath(); g.moveTo(CX + Math.cos(a) * (R + 12), cy + Math.sin(a) * (R + 12));
      g.lineTo(CX + Math.cos(a) * (R + 12 + len), cy + Math.sin(a) * (R + 12 + len)); g.stroke();
    }
  }
  for (const e of recent('clap', t, 0.7)) {
    const age = t - e.t; g.strokeStyle = rgba(PAL[4], 0.35 * e.vel * (1 - age / 0.7)); g.lineWidth = 1.5;
    g.beginPath(); g.arc(CX, cy, R + 20 + age * 420, 0, 6.29); g.stroke();
  }

  // The record, clipped by the horizon, and its reflection in the sea.
  g.save(); g.beginPath(); g.rect(0, 0, SW, HORIZON); g.clip();
  if (sun > 0) { const halo = g.createRadialGradient(CX, cy, R, CX, cy, R * 2.2);
    halo.addColorStop(0, rgba(PAL[5], 0.35 * sun)); halo.addColorStop(1, 'rgba(255,204,0,0)');
    g.fillStyle = halo; g.fillRect(0, 0, SW, HORIZON); }
  record(t, cy, sun, pulse); g.restore();
  g.fillStyle = '#0A0A0A'; g.fillRect(0, HORIZON, SW, SH - HORIZON);
  for (let k = 0; k < 90; k++) {
    const y = HORIZON + 4 + k * k * 0.04, ry = 2 * HORIZON - y;
    const w = Math.sqrt(Math.max(0, R * R - (ry - cy) ** 2)) * (0.8 + 0.4 * hash(k, Math.floor(t * 6)));
    if (!w) continue;
    g.fillStyle = rgba(sun > 0 ? PAL[5] : colourAt(t), (0.14 + 0.5 * sun) * (1 - k / 110) * open);
    g.fillRect(CX - w, y, w * 2, 1.5 + k * 0.03);
  }
  g.fillStyle = `rgba(255,255,255,${0.14 * open})`; g.fillRect(0, HORIZON, SW, 1);

  // Words.
  const kick2 = ramp(1, 2.5, t) * (1 - ramp(22, 23, t));
  text(`${clockAt(t)}  ·  THE LAST RECORD`, 190, 110, '400 15px "Space Mono", "Courier New", monospace', `rgba(176,176,176,${kick2})`, 'left', '4.5px');
  text(t < DROP ? '120 BPM  ·  A MINOR' : '120 BPM  ·  C MAJOR', 1730, 110, '400 15px "Space Mono", "Courier New", monospace', `rgba(176,176,176,${kick2})`, 'right', '4.5px');
  const line = ease(ramp(23, 24.4, t));
  if (line > 0) {
    g.save(); g.globalAlpha = line; g.translate(0, 18 * (1 - line));
    g.font = 'italic 300 84px Fraunces, Georgia, serif'; g.textAlign = 'left';
    const a = 'Last record. ', b = 'First light.', wa = g.measureText(a).width, wb = g.measureText(b).width, x = CX - (wa + wb) / 2;
    g.fillStyle = '#FFFFFF'; g.fillText(a, x, 150);
    const grad = g.createLinearGradient(x + wa, 0, x + wa + wb, 0);
    grad.addColorStop(0, PAL[2]); grad.addColorStop(0.55, PAL[3]); grad.addColorStop(1, PAL[5]);
    g.fillStyle = grad; g.fillText(b, x + wa, 150); g.restore();
  }
  text('jean-paul', 190, SH - 44, 'italic 400 30px Fraunces, Georgia, serif', `rgba(255,255,255,${ramp(26, 27.5, t)})`);
  text(playing ? '' : 'CLICK TO PLAY WITH SOUND', 1730, SH - 50, '400 12px "Space Mono", "Courier New", monospace',
    `rgba(176,176,176,${0.8 * Math.max(ramp(1, 2, t) * (1 - ramp(6, 7, t)), ramp(29, 30, t))})`, 'right', '3.5px');
  PAL.forEach((c, i) => { g.fillStyle = rgba(c, open); g.fillRect(i * SW / 6, SH - 6, SW / 6 + 1, 6); });
  g.restore();
}

// Time comes from the audio when it is playing, so picture and sound stay locked.
let t0 = performance.now(), fixed = null, playing = false;
if (matchMedia('(prefers-reduced-motion: reduce)').matches) t0 -= 30000;
window.renderAt = t => { fixed = t; frame(t); };
addEventListener('resize', fit);
cv.addEventListener('click', () => {
  track.currentTime = 0; t0 = performance.now();
  track.play().then(() => { playing = true; }).catch(() => { playing = false; });
});
track.addEventListener('ended', () => { playing = false; });
fit();
Promise.all(['italic 300 84px Fraunces', 'italic 400 30px Fraunces', '15px "Space Mono"']
  .map(f => document.fonts.load(f))).catch(() => {}).then(() => { t0 = performance.now(); });
(function loop(now) {
  const t = fixed ?? (playing ? track.currentTime : Math.min(30, (now - t0) / 1000));
  frame(t); requestAnimationFrame(loop);
})(performance.now());
</script>
